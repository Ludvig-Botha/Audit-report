<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1F4E79">
<title>JT Boiler Audit</title>
<style>
:root{--jt:#1F4E79;--bg:#f4f6f9;--card:#fff;--line:#d8dee7;--ok:#2e7d32;--bad:#c62828;--na:#757575;--amber:#ef6c00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#222;padding-bottom:96px}
header{position:sticky;top:0;z-index:5;background:var(--jt);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
header .back{font-size:22px;border:none;background:none;color:#fff;padding:4px 8px}
header h1{font-size:17px;margin:0;flex:1;line-height:1.2}
.wrap{padding:12px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:15px;color:var(--jt)}
.card.tap{cursor:pointer}
label{display:block;font-size:13px;color:#444;margin:10px 0 4px}
input[type=text],input[type=email],input[type=number],input[type=date],textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff;font-family:inherit}
textarea{min-height:74px}
.btn{display:inline-block;border:none;border-radius:8px;padding:12px 16px;font-size:15px;background:var(--jt);color:#fff;margin:6px 6px 0 0;font-family:inherit}
.btn.sec{background:#e6ebf2;color:var(--jt)}
.btn.warn{background:var(--bad)}
.btn.ok{background:var(--ok)}
.btn.small{padding:8px 12px;font-size:13px}
.btn.wide{width:100%;margin:8px 0 0}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.list-item .grow{flex:1;min-width:0}
.list-item .title{font-weight:bold;font-size:15px}
.list-item .sub{font-size:12.5px;color:#666;margin-top:3px}
.list-item.extra{border-left:4px solid var(--amber)}
.list-item.fuel{border-left:4px solid var(--jt)}
.badge{font-size:11px;padding:3px 8px;border-radius:10px;background:#e6ebf2;color:var(--jt);white-space:nowrap}
.badge.done{background:#e2f2e3;color:var(--ok)}
.badge.part{background:#fdeedd;color:var(--amber)}
.mark-ok{color:var(--ok);font-size:20px}.mark-no{color:var(--bad);font-size:20px}
.seg{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;padding:11px 4px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:14px;font-family:inherit}
.seg button.on-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.seg button.on-def{background:var(--bad);color:#fff;border-color:var(--bad)}
.seg button.on-na{background:var(--na);color:#fff;border-color:var(--na)}
.seg button.on-skip{background:#455a64;color:#fff;border-color:#455a64}
.prio{display:flex;gap:6px;margin-top:6px}
.prio button{flex:1;padding:9px 4px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:13px;font-family:inherit}
.prio button.on-H{background:var(--bad);color:#fff;border-color:var(--bad)}
.prio button.on-M{background:var(--amber);color:#fff;border-color:var(--amber)}
.prio button.on-L{background:#607d8b;color:#fff;border-color:#607d8b}
.prio button.on-N{background:var(--na);color:#fff;border-color:var(--na)}
.panel{border-top:1px dashed var(--line);margin-top:10px;padding-top:4px}
.addc{margin-top:10px;border:1px dashed var(--jt);background:#f3f7fc;color:var(--jt);border-radius:8px;padding:10px;width:100%;font-size:14px;font-family:inherit}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ph{width:104px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.ph img{width:104px;height:80px;object-fit:cover;display:block}
.ph .cap{width:100%;border:none;border-top:1px solid var(--line);font-size:11px;padding:5px}
.ph .inc{display:flex;align-items:center;font-size:11px;padding:4px 5px;gap:4px;border-top:1px solid var(--line)}
.ph .del{width:100%;border:none;background:#fbe9e7;color:var(--bad);font-size:11px;padding:5px}
.hint{font-size:12px;color:#777;margin-top:6px}
.progress{height:6px;background:#e0e6ee;border-radius:3px;margin-top:8px;overflow:hidden}
.progress div{height:100%;background:var(--jt)}
.footer-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px;gap:8px;z-index:5}
.footer-nav .btn{flex:1;margin:0;text-align:center}
.qnum{font-size:12px;color:#888}
h3.q{font-size:16px;margin:4px 0 2px}
.suggest{background:#eef3f9;border:1px dashed #b7c6da;border-radius:8px;padding:10px;font-size:13px;margin-top:8px}
.suggest .use{color:var(--jt);font-weight:bold;border:none;background:none;padding:6px 0 0;font-size:13px;font-family:inherit}
.center{text-align:center}
.big{font-size:17px;padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#e6ebf2;color:var(--jt);border-radius:16px;padding:6px 10px;margin:4px 4px 0 0;font-size:13px}
.chip button{border:none;background:none;color:var(--bad);font-size:14px;padding:0}
.genbox{background:#fff;border:2px solid var(--jt);border-radius:12px;padding:16px;margin-bottom:12px}
.status{font-size:14px;margin-top:10px;color:var(--jt);min-height:20px}
.warnbox{background:#fff4e5;border:1px solid #f5c58a;border-radius:8px;padding:10px;font-size:13px;margin-top:8px}
.dist{display:flex;gap:6px;margin-top:6px}
.dist input{flex:1}
select.sug{margin-top:2px;margin-bottom:6px;background:#eef3f9;border:1px dashed #b7c6da;color:var(--jt);font-size:13.5px}
.okline{margin-top:10px;background:#eaf5ea;border:1px solid #cfe6d0;border-radius:8px;padding:9px 10px;font-size:13.5px;color:#1b5e20}
</style>
</head>
<body>
<header><button class="back" id="backBtn" style="display:none">&#8592;</button><h1 id="hTitle">JT Boiler Audit</h1></header>
<div class="wrap" id="view"></div>
<div class="footer-nav" id="fnav" style="display:none"></div>

<script>
"use strict";
const APP_VER = /*VER*/;
const QDB = /*QDB*/;
const BP = /*BP*/;
const TPL = /*TPL*/;

/* =====================================================================
   STORAGE (IndexedDB) — same database as earlier versions, so existing
   reports and the edited question library carry over.
   ===================================================================== */
let db;
function idb(){ return new Promise((res,rej)=>{
  const r = indexedDB.open("jt_audit",2);
  r.onupgradeneeded = e=>{ const d=e.target.result;
    if(!d.objectStoreNames.contains("jobs")) d.createObjectStore("jobs",{keyPath:"id"});
    if(!d.objectStoreNames.contains("photos")){ const p=d.createObjectStore("photos",{keyPath:"id"}); p.createIndex("job","jobId"); }
    if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv",{keyPath:"k"});
  };
  r.onsuccess=e=>{db=e.target.result;res();}; r.onerror=e=>rej(e.target.error||e);
});}
const tx=(s,m)=>db.transaction(s,m).objectStore(s);
const put=(s,v)=>new Promise((res,rej)=>{const r=tx(s,"readwrite").put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
const del=(s,k)=>new Promise((res,rej)=>{const r=tx(s,"readwrite").delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
const get=(s,k)=>new Promise((res,rej)=>{const r=tx(s,"readonly").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const all=(s)=>new Promise((res,rej)=>{const r=tx(s,"readonly").getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const photosOf=(jobId)=>new Promise((res,rej)=>{const r=tx("photos","readonly").index("job").getAll(jobId);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
async function kvGet(k,dflt){ const r=await get("kv",k); return r?r.v:dflt; }
const kvPut=(k,v)=>put("kv",{k,v});

/* =====================================================================
   HELPERS
   ===================================================================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function yymmdd(){ const d=new Date(); return String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"); }
const clean=s=>(s||"").replace(/[^A-Za-z0-9]+/g,"").slice(0,20)||"X";
const tagOf=s=>(s||"").replace(/\(.*?\)/g,"").split(/[^A-Za-z0-9]+/).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1).toLowerCase()).join("").slice(0,20)||"Item";
function fmtDate(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||""); return m?`${m[3]}/${m[2]}/${m[1]}`:(iso||""); }
const mark=done=>done?'<span class="mark-ok">&#10004;</span>':'<span class="mark-no">&#10008;</span>';

const FIRING={
  stoker:{label:"Coal fired (chain grate stoker)",short:"Coal / stoker",fuel:"coal",part:"stoker"},
  burner:{label:"Oil / gas fired (burner)",short:"Oil / gas burner",fuel:"oil",part:"burner"},
  biomass:{label:"Biomass fired",short:"Biomass",fuel:"biomass",part:"biomass"}};
const firingOf=b=>FIRING[b.firing]||FIRING.burner;

const FUEL_FIELDS={
  coal:[["supplier","Supplier / mine"],["cv","Calorific value (MJ/kg)"],["moisture","Total moisture (%)"],["ash","Ash content (%)"],["volatile","Volatile matter (%)"],["fixedCarbon","Fixed carbon (%)"],["sulphur","Sulphur (%)"],["aft","Ash fusion temperature (°C)"],["size","Size grading"]],
  oil:[["supplier","Supplier"],["cv","Calorific value (MJ/kg)"],["density","Density (kg/m³)"],["viscosity","Viscosity (cSt @ °C)"],["sulphur","Sulphur (%)"],["flash","Flash point (°C)"],["water","Water content (%)"],["supplyTemp","Supply temperature at burner (°C)"]],
  biomass:[["supplier","Supplier / source"],["cv","Calorific value (MJ/kg)"],["moisture","Moisture content (%)"],["ash","Ash content (%)"],["size","Particle size / grading"],["bulk","Bulk density (kg/m³)"],["contaminants","Contaminants (sand, stones, metal)"]]};
const FUEL_COMMON_END=[["analysis","Fuel analysis report available"],["analysisDate","Date of last fuel analysis"],["notes","Notes"]];
const FUEL_PHOTOS=[["FuelSample","Fuel sample"],["FuelAnalysis","Fuel analysis report"],["FuelStorage","Fuel storage & handling"]];
const FUEL_CAT_LABEL={coal:"Coal",oil:"Oil / gas",biomass:"Biomass"};

/* =====================================================================
   QUESTION LIBRARY + SAVED LISTS + SETTINGS
   ===================================================================== */
let LIB=null, LISTS=null, SETTINGS=null;
const PARTS=[["shared","Shared (all boilers)"],["stoker","Coal / stoker"],["burner","Oil / gas burner"],["biomass","Biomass"],["site","Site-wide"]];
const QS_VER=6;
function seedPart(part){ return JSON.parse(JSON.stringify(QDB[part]||[])).map((s,si)=>{ s.id=s.id||`b_${part}_${si}`;
  s.items.forEach((it,qi)=>{ it.id=it.id||`${s.id}_${qi}`; }); return s; }); }
function seedLib(){ const L={}; PARTS.forEach(([p])=>L[p]=seedPart(p)); L._v=QS_VER; return L; }
const seedSec=id=>{ for(const [p] of PARTS) for(const s of QDB[p]||[]) if(s.id===id) return JSON.parse(JSON.stringify(s)); return null; };
/* Brings a question set from any earlier app version to the current layout (same logic as upgrade_qs in generate_report.py):
   fuel handling / ring main -> site-wide, combustion test split into load points, renames, priorities default to N/A. */
function upgradeQS(qs){ const info={ct:null};
  PARTS.forEach(([p])=>{ qs[p]=qs[p]||[]; });
  const seedByQ={}; PARTS.forEach(([p])=>(QDB[p]||[]).forEach(s=>s.items.forEach(it=>{ seedByQ[it.q]=it; })));
  const take=(part,re)=>{ const out=[]; qs[part].forEach(s=>{ s.items=s.items.filter(it=>{ if(re.test(it.q)){ out.push(it); return false; } return true; }); }); return out; };
  [["Minimum air pressure switch","Secondary air pressure switch"],["Primary air differential pressure switch","Primary air pressure switch"]].forEach(([o,n])=>
    qs.burner.forEach(s=>s.items.forEach(it=>{ if(it.q===o){ it.q=n; const d=seedByQ[n]; if(d&&!it.fs&&!it.rs){ it.f=d.f; it.r=d.r; } } })));
  const front=[];
  const siteSec=(id,re)=>{ let x=qs.site.find(z=>z.id===id||re.test(z.section)); if(!x){ const d=seedSec(id); x={id,section:d.section,fir:d.fir,items:[]}; }
    if(!front.includes(x)) front.push(x); return x; };
  const fi=qs.burner.findIndex(s=>/^Fuel \/ HFO Handling/i.test(s.section));
  const ring=take("burner",/^(Ring ?main|Heat tracing on oil lines)/i);
  if(fi>=0||ring.length){ let fh;
    if(fi>=0){ fh=qs.burner.splice(fi,1)[0]; fh.id=fh.id||"b_burner_0"; fh.section="Fuel / HFO Handling & Ring Main"; front.push(fh); }
    else fh=siteSec("b_burner_0",/^Fuel \/ HFO Handling/i);
    fh.fir="burner"; fh.items.push(...ring);
    fh.items.forEach(it=>{ if(/^(DATA|MEASURED): /.test(it.q)) it.q=it.q.replace(" at burner (spec)"," (spec)").replace(/ at burner$/,""); }); }
  const coal=take("stoker",/^Fuel analysis records available/i);
  if(coal.length){ const x=siteSec("b_site_fuelcoal",/^Fuel Storage & Handling — Coal/i); x.fir="stoker"; x.items.push(...coal); }
  const bio=take("biomass",/^(Fuel storage|Fuel moisture)/i);
  if(bio.length){ const x=siteSec("b_site_fuelbio",/^Fuel Storage & Handling — Biomass/i); x.fir="biomass"; x.items.push(...bio); }
  qs.biomass.forEach(s=>{ if(/^Fuel Handling & Feeding/i.test(s.section)) s.section="Fuel Feeding — Biomass"; });
  qs.site=front.concat(qs.site.filter(x=>!front.includes(x)));
  let at=-1;
  qs.burner.forEach((s,i)=>{ const k=s.items.findIndex(it=>/^Combustion test/i.test(it.q)); if(k>=0){ info.ct={id:s.items[k].id,t:s.items[k].t}; s.items.splice(k,1); at=i; } });
  if(!qs.burner.some(s=>s.id==="b_burner_ct"||/^Combustion Test/.test(s.section))){
    if(at<0) at=qs.burner.findIndex(s=>/^Combustion/i.test(s.section));
    qs.burner.splice(at<0?qs.burner.length:at+1,0,seedSec("b_burner_ct")); }
  PARTS.forEach(([p])=>qs[p].forEach(s=>{ s.id=s.id||"s"+uid(); s.items.forEach(it=>{ it.id=it.id||"q"+uid(); it.p="N/A"; it.d=it.d||"check"; it.t=it.t||tagOf(it.q);
    if(!it.ok&&it.d!=="data"){ const d=seedByQ[it.q]; if(d&&d.ok) it.ok=d.ok; } }); }));
  qs._v=QS_VER; return info; }
async function loadLib(){
  const v=await kvGet("lib",null);
  if(!v){ LIB=seedLib(); await saveLib(); return; }
  LIB=v; let changed=false;
  PARTS.forEach(([p])=>{ if(!LIB[p]){ LIB[p]=seedPart(p); changed=true; } });
  if(!LIB._v||LIB._v<5){ // fuel type is on the Fuel form, not a burner question
    LIB.burner.forEach(s=>{ s.items=s.items.filter(it=>!/^DATA: Fuel type used/.test(it.q)); }); LIB._v=5; changed=true; }
  if(LIB._v<QS_VER){ upgradeQS(LIB); changed=true; }
  if(changed) await saveLib();
}
function saveLib(){ return kvPut("lib",LIB); }
const DEFAULT_LISTS={
  fuel:{coal:["Grade A Peas","Grade B Peas","Grade C Smalls"],
        oil:["HFO","RFO","LFO","Diesel","Paraffin","LPG","Natural gas"],
        biomass:["Wood chips","Bagasse","Sawdust","Macadamia nut shells","Rice husk","Wood pellets"]},
  extras:{"Economiser":["Economiser tubes / fins condition","Water inlet / outlet temperature","Flue gas inlet / outlet temperature","Cleaning / soot blowing","Bypass damper operation","Leaks"],
          "Bag filter":["Filter bags condition","Differential pressure across bags","Pulse-jet cleaning / compressed air supply","Hopper, rotary valve & dust discharge","High temperature protection / bypass","Visible emissions at stack"]}};
async function loadLists(){ LISTS=await kvGet("lists",null);
  if(!LISTS){ LISTS=JSON.parse(JSON.stringify(DEFAULT_LISTS)); await kvPut("lists",LISTS); }
  LISTS.fuel=LISTS.fuel||{}; ["coal","oil","biomass"].forEach(c=>LISTS.fuel[c]=LISTS.fuel[c]||[]); LISTS.extras=LISTS.extras||{}; LISTS.sug=LISTS.sug||{}; }
const saveLists=()=>kvPut("lists",LISTS);
function rememberFuel(cat,name){ name=(name||"").trim(); if(!name)return; const l=LISTS.fuel[cat];
  if(!l.some(x=>x.toLowerCase()===name.toLowerCase())){ l.push(name); saveLists(); } }
function rememberExtra(name,title){ name=(name||"").trim(); if(!name)return; const key=Object.keys(LISTS.extras).find(k=>k.toLowerCase()===name.toLowerCase())||name;
  LISTS.extras[key]=LISTS.extras[key]||[]; if(title&&!LISTS.extras[key].some(t=>t.toLowerCase()===title.toLowerCase())) LISTS.extras[key].push(title); saveLists(); }
async function loadSettings(){ SETTINGS=await kvGet("settings",{name:"",title:"Service Engineer",email:"",phone:""}); }

/* =====================================================================
   JOB MODEL
   ===================================================================== */
let job=null;
function saveJob(){ job.updated=Date.now(); return put("jobs",job); }
function fixJob(j){
  j.answers=j.answers||{}; j.boilers=j.boilers||[];
  j.scope=j.scope||{requested:[""],done:[""]};
  j.scope.requested=j.scope.requested&&j.scope.requested.length?j.scope.requested:[""];
  j.scope.done=j.scope.done&&j.scope.done.length?j.scope.done:[""];
  const c=j.customer=j.customer||{};
  if(!Array.isArray(c.dist)){ c.dist=String(c.emails||"").split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean).map(e=>({name:e,email:e})); }
  if(!j.prepared) j.prepared={name:(SETTINGS&&SETTINGS.name)||"",title:(SETTINGS&&SETTINGS.title)||""};
  j.fuels=j.fuels||[];
  j.boilers.forEach(b=>{ if(typeof b.fuel==="string") b.fuel={type:b.fuel}; b.extras=b.extras||[]; if(!FIRING[b.firing]) b.firing="burner"; });
  return j;
}
/* Brings a job captured with an earlier version to the current layout (same logic as upgrade_job in generate_report.py).
   photos = the job's photo records; returns the records that were changed. */
const PRANK={High:3,Medium:2,Low:1};
function mergeAns(answers,key,a,note){ const t=answers[key]; const has=x=>x&&(x.s||x.v||x.f||x.r||x.e);
  if(!has(a)) return; if(!has(t)){ answers[key]=a; return; }
  if(a.s==="Defect"||!t.s) t.s=a.s||t.s;
  ["f","r"].forEach(k=>{ if(a[k]&&!String(t[k]||"").includes(a[k])) t[k]=(t[k]?t[k]+"\n":"")+a[k]; });
  if(a.f) t.fAuto=false; if(!t.v) t.v=a.v; if(!t.e) t.e=a.e;
  if((PRANK[a.p]||0)>(PRANK[t.p]||0)) t.p=a.p; }
function upgradeJob(J,photos){ photos=photos||[]; const changed=new Set();
  const ctOld=["b_burner_1_16"], ctOldTag=["CombustionTest"];
  if(J.qs&&(J.qs._v||0)<QS_VER){ const info=upgradeQS(J.qs); if(info.ct){ ctOld.push(info.ct.id); ctOldTag.push(info.ct.t); } }
  const qs=J.qs||LIB; const siteIt={}, siteTag={}; (qs.site||[]).forEach(s=>s.items.forEach(it=>{ siteIt[it.id]=it; siteTag[it.t]=it; }));
  J.fuels=J.fuels||[]; let fn=J.fuels.length;
  J.boilers.forEach(b=>{ const set=setOfB(qs,b); const own=new Set(), ownTag=new Set(); set.forEach(s=>s.items.forEach(it=>{ own.add(it.id); ownTag.add(it.t); }));
    const ctSec=set.find(s=>s.inline&&/combustion test/i.test(s.section)); const ctNew=ctSec&&ctSec.items[0];
    Object.keys(J.answers).forEach(k=>{ if(!k.startsWith(b.id+"|")) return; const qid=k.slice(b.id.length+1); if(own.has(qid)) return;
      if(siteIt[qid]){ mergeAns(J.answers,"site|"+qid,J.answers[k]); delete J.answers[k]; }
      else if(ctNew&&ctOld.includes(qid)){ mergeAns(J.answers,b.id+"|"+ctNew.id,J.answers[k]); delete J.answers[k]; } });
    photos.forEach(p=>{ if(p.scope!==b.id||ownTag.has(p.tag)) return;
      if(ctNew&&ctOldTag.includes(p.tag)){ p.tag=ctNew.t; p.qid=ctNew.id; changed.add(p); }
      else if(siteTag[p.tag]){ p.scope="site"; p.qid=siteTag[p.tag].id; changed.add(p); } });
    const bf=b.fuel;
    if(bf&&typeof bf==="object"){ const cat=(FIRING[b.firing]||FIRING.burner).fuel; let f=null;
      const mk=()=>{ f={id:"f"+(++fn)+uid().slice(-4),cat,type:""}; J.fuels.push(f); return f; };
      if(Object.keys(bf).some(k=>k!=="typeOther"&&bf[k])){
        f=J.fuels.find(x=>x.cat===cat&&String(x.type||"").toLowerCase()===String(bf.type||"").toLowerCase());
        if(!f) mk(); Object.keys(bf).forEach(k=>{ if(k!=="id"&&k!=="cat"&&!f[k]) f[k]=bf[k]; }); b.fuelId=f.id; }
      photos.forEach(p=>{ if(p.scope===b.id&&FUEL_PHOTOS.some(x=>x[0]===p.tag)){ if(!f) mk(); p.scope="site"; p.tag=p.tag+"_"+f.id; p.label=""; changed.add(p); } });
      delete b.fuel; } });
  J.schema=QS_VER; return [...changed]; }
const setOfB=(qs,b)=>(qs.shared||[]).concat(qs[(FIRING[b.firing]||FIRING.burner).part]||[]);
const fuelsOf=(J,b)=>(J.fuels||[]).filter(f=>f.cat===(FIRING[b.firing]||FIRING.burner).fuel);
function boilerFuel(J,b){ const fs=fuelsOf(J,b).filter(f=>f.type); const pick=fs.find(f=>f.id===b.fuelId); return pick?pick.type:fs.map(f=>f.type).join(" / "); }
function ensureFuels(){ let ch=false; [...new Set(job.boilers.map(b=>firingOf(b).fuel))].forEach(c=>{
  if(!job.fuels.some(f=>f.cat===c)){ job.fuels.push({id:"f"+uid(),cat:c,type:""}); ch=true; } }); return ch; }
const QS=()=>job.qs||LIB;
const boilerOf=id=>job.boilers.find(x=>x.id===id);
function setFor(scope){ const q=QS(); if(scope!=="site") return setOfB(q,boilerOf(scope));
  // fuel sections only show when the site has that kind of boiler (or was already answered)
  return (q.site||[]).filter(s=>!s.fir||job.boilers.some(b=>b.firing===s.fir)||s.items.some(it=>{ const a=job.answers["site|"+it.id]; return a&&(a.s||a.v); })); }
const qKey=(scope,qid)=>scope+"|"+qid;
function ans(scope,qid){ const k=qKey(scope,qid); if(!job.answers[k]) job.answers[k]={s:"",f:"",r:"",p:"",v:"",e:""}; return job.answers[k]; }
const answered=(it,a)=>!!(a&&(a.s||((it.d==="data")&&a.v)));
function counts(scope){ let t=0,d=0;
  setFor(scope).forEach(sec=>sec.items.forEach(it=>{ t++; if(answered(it,job.answers[qKey(scope,it.id)])) d++; }));
  if(scope!=="site"){ const b=boilerOf(scope); b.extras.forEach(x=>x.items.forEach(i=>{ t++; if(i.s) d++; })); }
  return [d,t]; }

/* =====================================================================
   NAVIGATION
   ===================================================================== */
const stack=[]; let objURLs=[]; let PT={}, ptN=0;
function go(fn,...args){ stack.push([fn,args]); fn(...args); }
function back(){ stack.pop(); if(stack.length){ const [fn,args]=stack[stack.length-1]; fn(...args);} else home(); }
$("backBtn").onclick=back;
function screen(title,html,fnavHtml,keepScroll){ const y=window.scrollY;
  objURLs.forEach(u=>URL.revokeObjectURL(u)); objURLs=[];
  $("hTitle").textContent=title; $("view").innerHTML=html;
  $("backBtn").style.display=stack.length>1?"":"none";
  const f=$("fnav"); if(fnavHtml){f.innerHTML=fnavHtml;f.style.display="flex";} else {f.style.display="none";}
  if(keepScroll){ window.scrollTo(0,y); requestAnimationFrame(()=>window.scrollTo(0,y)); } else window.scrollTo(0,0); }
function rerender(){ const [fn,args]=stack[stack.length-1]; fn(...args,true); }

   QUESTIONNAIRE

function quest(scope,si,_k){ const set=setFor(scope); if(si>=set.length){ back(); return; }
  PT={}; const sec=set[si];
  const title=scope==="site"?"Site-Wide":"Boiler "+boilerOf(scope).no;
  let h=`<div class="hint">${esc(sec.section)} &middot; section ${si+1}/${set.length}</div>`;
  const keys=[];
  sec.items.forEach((it,qi)=>{ const k=ptKey(scope,it.t,it.q.replace(/^(DATA|MEASURED): /,""),it.id); keys.push(k); h+=qCard(scope,si,qi,it,k); });
  screen(title,h,
   `<button class="btn sec" onclick="prevSec('${scope}',${si})">&#8592; Prev</button>
    <button class="btn" onclick="nextSec('${scope}',${si})">${si+1<set.length?"Next section &#8594;":"Done"}</button>`,_k);
  keys.forEach(renderPhotos); }
function prevSec(scope,si){ if(si>0){ stack.pop(); go(quest,scope,si-1);} else back(); }
async function nextSec(scope,si){ await saveJob(); stack.pop(); go(quest,scope,si+1); }
const PRIOS=[["High","H"],["Medium","M"],["Low","L"],["N/A","N"]];
const lines=t=>String(t||"").split(/\r?\n+/).map(x=>x.trim()).filter(Boolean);
const uniq=l=>{ const seen=new Set(), o=[]; l.forEach(t=>{ t=String(t||"").trim(); const k=t.toLowerCase(); if(t&&!seen.has(k)){ seen.add(k); o.push(t); } }); return o; };
const sugOf=(it,k)=>uniq([it[k]].concat(it[k+"s"]||[]));
const xKey=(name,title)=>(String(name||"").trim()+"|"+String(title||"").trim()).toLowerCase();
function okGeneric(t){ const b=baseName(String(t||"").replace(/^(DATA|MEASURED): /,"")).replace(/\?+$/,"").trim();
  if(/^leaks?$/i.test(b)) return "No leaks were found.";
  return `${b} ${(/[^s]s$/i.test(b)||/ & |, | and | \/ /.test(b))?"are":"is"} in a good condition.`; }
const okText=T=>T.it?(T.it.ok||okGeneric(T.it.q)):okGeneric(T.a.title);
function sugFor(T,field){ let l;
  if(T.it) l=sugOf(T.it,field); else { const x=(LISTS.sug||{})[xKey(T.x.name,T.a.title)]||{}; l=x[field+"s"]||[]; }
  if(field==="f"&&T.a.s==="OK") l=[okText(T)].concat(l);
  return uniq(l); }
function sugSelect(list,call,field,what){ return list.length?`<select class="sug" onchange="pickSug(${call},'${field}',this.value)">
   <option value="">&#9662; Pick a suggested ${what} (${list.length})</option>${list.map((t,i)=>`<option value="${i}">${esc(t)}</option>`).join("")}</select>`:""; }
function commentPanel(T,call){ const a=T.a; const dflt=a.s==="Defect"&&T.it&&T.it.f;
  return `<div class="panel">
   <label>${a.s==="OK"?"Comment / finding":"Finding"}</label>${sugSelect(sugFor(T,"f"),call,"f","finding")}
   <textarea placeholder="${dflt?esc("If left empty the report uses: "+T.it.f):"Type the finding (one per line)"}" onchange="setF(${call},'f',this.value)">${esc(a.f)}</textarea>
   <label>Recommendation</label>${sugSelect(sugFor(T,"r"),call,"r","recommendation")}
   <textarea placeholder="Type the recommendation (one per line)" onchange="setF(${call},'r',this.value)">${esc(a.r)}</textarea>
   <label>Priority list</label><div class="prio">${PRIOS.map(([p,c])=>`<button class="${(a.p||"N/A")===p?"on-"+c:""}" onclick="setP(${call},'${p}')">${p}</button>`).join("")}</div>
   <p class="hint">What you type is saved in the suggestion list for next time. The finding is also the caption of this question's photos. N/A = not in the priority list at the end of the report.</p></div>`; }
function answerBody(T,call){ const a=T.a;
  const custom=a.c||String(a.r||"").trim()||(a.p&&a.p!=="N/A")||(String(a.f||"").trim()&&!a.fAuto);
  if(a.s==="Defect"||(a.s==="OK"&&custom)) return commentPanel(T,call);
  if(a.s==="OK") return (a.f?`<div class="okline">&#10004; ${esc(T.it?findingOf(T.it,a):a.f)}</div>`:"")+`<button class="addc" onclick="openC(${call})">&#9998; Edit comment / add recommendation</button>`;
  return ""; }
function statusSeg(a,call){ return `<div class="seg">${["OK","Defect","N/A","Skip"].map(s=>{
  const on=a.s===s?("on-"+({OK:"ok",Defect:"def","N/A":"na",Skip:"skip"}[s])):"";

function qCard(scope,si,qi,it,k){ const a=ans(scope,it.id); const call=`'q','${scope}','${it.id}'`;

/* shared answer handlers. kind 'q' = library question (scope,qid); kind 'x' = additional equipment item (bid, "xid:iid") */
function target(kind,scope,id){
  if(kind==="q") return {a:ans(scope,id), it:findItem(scope,id)};
  const [xid,iid]=id.split(":"); const x=boilerOf(scope).extras.find(e=>e.id===xid); return {a:x.items.find(i=>i.id===iid), it:null, x}; }
function findItem(scope,qid){ for(const s of setFor(scope)) for(const it of s.items) if(it.id===qid) return it; return null; }
function libTwin(it){ let hit=null; PARTS.forEach(([p])=>LIB[p].forEach(s=>s.items.forEach(x=>{ if(x.id===it.id&&x.q===it.q) hit=x; })));
  if(!hit) PARTS.forEach(([p])=>LIB[p].forEach(s=>s.items.forEach(x=>{ if(!hit&&x.q===it.q) hit=x; }))); return hit; }
/* every finding / recommendation typed by hand is remembered as a suggestion for that question */
function learn(T,field,val){ const ok=okText(T).toLowerCase(); const ls=lines(val).filter(t=>t.length>2&&t.toLowerCase()!==ok); if(!ls.length) return;
  const key=field+"s"; const add=list=>{ let ch=false; ls.forEach(t=>{ if(!list.some(x=>x.toLowerCase()===t.toLowerCase())){ list.push(t); ch=true; } }); return ch; };
  if(T.it){ const its=[T.it]; if(job.qs){ const tw=libTwin(T.it); if(tw) its.push(tw); } let ch=false;
    its.forEach(it=>{ if(!it[key]) it[key]=it[field]?[it[field]]:[]; if(add(it[key])) ch=true; }); if(ch) saveLib(); }
  else { LISTS.sug=LISTS.sug||{}; const k=xKey(T.x.name,T.a.title); const e=LISTS.sug[k]=LISTS.sug[k]||{fs:[],rs:[]}; e[key]=e[key]||[]; if(add(e[key])) saveLists(); } }
async function setS(kind,scope,id,s){ const T=target(kind,scope,id); const a=T.a; a.s=(a.s===s?"":s);
  if(a.fAuto&&a.s!=="OK"){ a.f=""; a.fAuto=false; }                                   // drop the automatic "good condition" comment
  if(a.s==="OK"&&!String(a.f||"").trim()){ a.f=okText(T); a.fAuto=true; }            // OK = "<item> is in a good condition."
  if(a.s&&!a.p) a.p="N/A";                                                            // every priority starts at N/A
  await saveJob(); rerender(); }
async function setF(kind,scope,id,field,val,redraw){ const T=target(kind,scope,id); T.a[field]=val;
  if(field==="f") T.a.fAuto=false; if(field==="f"||field==="r") learn(T,field,val);
  await saveJob(); if(redraw) rerender(); }
async function setP(kind,scope,id,p){ const {a}=target(kind,scope,id); a.p=p; await saveJob(); rerender(); }
async function openC(kind,scope,id){ const {a}=target(kind,scope,id); a.c=true; await saveJob(); rerender(); }
async function pickSug(kind,scope,id,field,idx){ if(idx==="")return; const T=target(kind,scope,id); const a=T.a; const t=sugFor(T,field)[+idx]; if(!t)return;
  const cur=String(a[field]||"").trim();
  if(!cur||(field==="f"&&a.fAuto)) a[field]=t; else if(!lines(cur).some(x=>x.toLowerCase()===t.toLowerCase())) a[field]=cur+"\n"+t;
  if(field==="f") a.fAuto=(a.s==="OK"&&a.f===okText(T));
  a.c=true; await saveJob(); rerender(); }

  screen("Generate Report",`

     <button class="btn big wide" id="genBtn" onclick="doGenerate()">Generate Word Report</button>

       <button class="btn sec wide" onclick="download(lastReport.blob,lastReport.name)">Download again</button></div></div>
   <div class="card"><h2>&#128230; Export ZIP (for the laptop)</h2>

     <button class="btn sec wide" onclick="doExport()">Export ZIP</button><div class="status" id="expStatus"></div></div>`,null,_k);
  if(lastReport&&lastReport.jobId===job.id){ $("genAfter").style.display=""; $("genStatus").textContent="Ready: "+lastReport.name; } }
function reportFileName(){ const c=job.customer; return [c.reportNo?clean(c.reportNo):yymmdd(), clean(c.name)||"Customer", "Boiler_House_Audit_Report"].join("_")+".docx"; }
async function doGenerate(){ const btn=$("genBtn"), st=$("genStatus"); btn.disabled=true; $("genAfter").style.display="none";

/* =====================================================================
   REPORT MODEL (shared logic with generator/generate_report.py)
   ===================================================================== */
const cleanSec=s=>String(s||"").replace(/\s*\((?:report|data)[^)]*\)\s*$/i,"").trim();
const qText=it=>String(it.q||"").replace(/^(DATA|MEASURED): /,"");
const baseName=q=>q.replace(/\s*(&\s*)?condition(\s*&\s*test)?\s*$/i,"").trim();
function findingOf(it,a){ let t=a.s==="Defect"?(a.f||(it&&it.f)||""):(a.s==="OK"?(a.f||""):"");
  if(a.v) t=t.replace(/_{3,}/g,a.v); return t.trim(); }
function recOf(it,a){ return (a.s==="Defect"?(a.r||(it&&it.r)||""):(a.s==="OK"?(a.r||""):"")).trim(); }
const PRIO=["High","Medium","Low"];
const pctVal=v=>/^\s*\d+([.,]\d+)?\s*$/.test(v)?String(v).trim()+" %":String(v).trim();
/* phKeys = Set of "scope|tag" that have photos in the report. Every question becomes its own block
   (title, data, finding, recommendation, its photos); plain "good condition" OKs without photos are listed together. */
function reportModel(J,phKeys){
  const qs=J.qs||LIB; phKeys=phKeys||new Set();
  const bLabel=b=>"Boiler "+(b.no||"");
  const order=[], secs={};               // section name -> [{boiler,...entry}]
  const prio={High:[],Medium:[],Low:[]};  // [{group, text, section}]
  let defects=0;
  const addPrio=(p,group,text,section)=>{ if(PRIO.includes(p)) lines(text).forEach(t=>prio[p].push({group,text:t,section})); };
  const newEntry=(name,inline,ct)=>({name,data:[],blocks:[],good:[],find:[],recs:[],table:[],thead:ct?["Load point","Flue gas O2"]:["Measurement","Value"],inline:!!inline,tags:[],touched:false});
  const done=e=>{ e.empty=!e.data.length&&!e.blocks.length&&!e.good.length&&!e.find.length&&!e.recs.length&&!e.table.length; return e; };
  // one question / check -> block or "good" line
  const addItem=(e,o)=>{ // o={title,key,d,s,f,r,p,v,vLabel,eq,auto}
    const hasPh=phKeys.has(o.key);
    if(o.s||o.v||o.eq||hasPh) e.touched=true; else return;
    if(o.s==="Defect") defects++;
    const fl=(o.s==="Defect"||o.s==="OK")?lines(o.f):[], rl=(o.s==="Defect"||o.s==="OK")?lines(o.r):[];
    if(o.s==="Defect"||o.s==="OK") addPrio(o.p,e.group,o.r||o.f,e.name);
    if(o.d==="data"&&!hasPh&&!fl.length){ if(o.v) e.data.push(o.title+": "+o.v); return; }
    if(o.s==="OK"&&o.auto&&!rl.length&&!hasPh&&!o.v&&!o.eq){ e.good.push(...fl); return; }
    const data=[]; if(o.eq) data.push(o.eqLabel+": "+o.eq); if(o.v) data.push((o.d==="data"?"Value":"Measured")+": "+o.v);
    e.blocks.push({title:o.title,data,find:fl,recs:rl,key:o.key}); };
  const entry=(sec,scope,group)=>{ const ct=/combustion test/i.test(sec.section);
    const e=newEntry(cleanSec(sec.section),sec.inline,ct); e.group=group;
    sec.items.forEach(it=>{ const a=J.answers[scope+"|"+it.id]||{};
      if(e.inline){ // combustion test: results table + findings + all photos together
        e.tags.push(it.t); if(it.d==="measured") e.table.push([qText(it).replace(/\s*O2 measurement$/i,""),a.v?(ct?pctVal(a.v):a.v):"Not measured"]);
        if(a.s||a.v||a.e||phKeys.has(scope+"|"+it.t)) e.touched=true;
        if(a.s==="Defect") defects++;
        if(a.s==="Defect"||a.s==="OK"){ const f=findingOf(it,a), r=recOf(it,a);
          if(!(a.s==="OK"&&a.fAuto)) lines(f).forEach(x=>e.find.push(x));
          lines(r).forEach(x=>e.recs.push(x)); addPrio(a.p,group,r||f,e.name); }
        return; }
      addItem(e,{title:qText(it),key:scope+"|"+it.t,d:it.d,s:a.s,f:findingOf(it,a),r:recOf(it,a),p:a.p,v:it.d==="check"?"":a.v,
        eq:it.opts?a.e:"",eqLabel:"Equipment",auto:!!a.fAuto}); });
    return done(e); };
  J.boilers.forEach(b=>{
    const entries=setOfB(qs,b).map(sec=>entry(sec,b.id,bLabel(b)));
    (b.extras||[]).forEach(x=>{ const e=newEntry(cleanSec(x.name)); e.group=bLabel(b); e.extra=true;
      x.items.forEach(i=>{ let f=(i.f||"").trim(); if(!f&&i.s==="Defect") f=i.title+": defect noted.";
        addItem(e,{title:i.title,key:b.id+"|X"+i.id,d:"check",s:i.s,f,r:(i.r||"").trim(),p:i.p,auto:!!i.fAuto}); });
      entries.push(done(e)); });
    entries.filter(e=>e.touched).forEach(e=>{ if(!secs[e.name]){ secs[e.name]=[]; order.push(e.name); } secs[e.name].push(Object.assign({boiler:b},e)); });
  });
  const site=(qs.site||[]).map(sec=>entry(sec,"site","Site")).filter(e=>e.touched);
  const groups=J.boilers.map(bLabel).concat(["Site"]);
  return {order,secs,site,prio,groups,defects};
}

/* =====================================================================
   WORD (DOCX) WRITER — fills the JT template skeleton
   ===================================================================== */
const XE=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
const BODY_W=9412;  // twips between the 2.2 cm side margins
function wRuns(text,o){ o=o||{};
  let rpr=""; if(o.bold) rpr+="<w:b/>"; if(o.italic) rpr+="<w:i/>"; if(o.sz) rpr+=`<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>`;
  rpr=rpr?`<w:rPr>${rpr}</w:rPr>`:"";
  return String(text==null?"":text).split("\t").map(s=>s?`<w:r>${rpr}<w:t xml:space="preserve">${XE(s)}</w:t></w:r>`:"").join(`<w:r>${rpr}<w:tab/></w:r>`); }
function wP(text,o){ o=o||{}; let ppr="";
  if(o.style) ppr+=`<w:pStyle w:val="${o.style}"/>`;
  if(o.keepNext) ppr+="<w:keepNext/>";
  if(o.keepLines) ppr+="<w:keepLines/>";
  if(o.tabs) ppr+="<w:tabs>"+o.tabs.map(p=>`<w:tab w:val="left" w:pos="${p}"/>`).join("")+"</w:tabs>";
  if(o.before!=null||o.after!=null) ppr+=`<w:spacing${o.before!=null?` w:before="${o.before}"`:""}${o.after!=null?` w:after="${o.after}"`:""}/>`;
  if(o.ind) ppr+=`<w:ind w:left="${o.ind[0]}" w:hanging="${o.ind[1]}"/>`;
  if(o.jc) ppr+=`<w:jc w:val="${o.jc}"/>`;
  return `<w:p>${ppr?`<w:pPr>${ppr}</w:pPr>`:""}${o.raw||wRuns(text,o)}</w:p>`; }
const wPageBreak=()=>`<w:p><w:r><w:br w:type="page"/></w:r></w:p>`;
const wH=(lvl,text,upper)=>wP((upper==null?lvl<=2:upper)?String(text).toUpperCase():text,{style:"Heading"+lvl,keepNext:true});
const wBullet=(t,keep)=>wP("•\t"+t,{style:"ListParagraph",ind:[720,360],tabs:[720],after:40,keepNext:!!keep});
const wBulletL=(label,t,keep)=>wP("",{style:"ListParagraph",ind:[720,360],tabs:[720],after:40,keepNext:!!keep,raw:wRuns("•\t")+wRuns(label,{bold:true})+wRuns(t)});
const wLabel=(t,o)=>wP(t,Object.assign({bold:true,keepNext:true,before:120,after:40},o||{}));
function wTable(rows,widths,o){ o=o||{};
  const grid=widths.map(w=>`<w:gridCol w:w="${w}"/>`).join("");
  const trs=rows.map((r,ri)=>`<w:tr><w:trPr><w:cantSplit/></w:trPr>${r.map((c,i)=>`<w:tc><w:tcPr><w:tcW w:w="${widths[i]}" w:type="dxa"/></w:tcPr>${wP(c,{bold:(o.boldFirst&&i===0)||(o.head&&ri===0),after:0})}</w:tc>`).join("")}</w:tr>`).join("");
  return `<w:tbl><w:tblPr><w:tblStyle w:val="TableGrid"/><w:tblW w:w="${widths.reduce((a,b)=>a+b,0)}" w:type="dxa"/><w:tblLayout w:type="fixed"/><w:tblLook w:val="04A0"/></w:tblPr><w:tblGrid>${grid}</w:tblGrid>${trs}</w:tbl>`+wP("",{after:0}); }
function wImage(rid,cx,cy,id){ return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="Photo ${id}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="photo${id}.jpg"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`; }
/* photo grid: 2 x 2 per page, image fitted in BOX, rows spread evenly. Inline grids (combustion test) use a lower box. */
const EMU_CM=360000, BOX_W=Math.round(7.6*EMU_CM), BOX_H=Math.round(8.0*EMU_CM), ROW_H=Math.round(9.8*567);
const INL_H=Math.round(5.6*EMU_CM), INL_ROW=Math.round(6.6*567), CAP_MAX=230;   // photos in the text: 2 side by side, ~6 cm
function wPhotoGrid(cells,rowH){ const colW=BODY_W/2;
  const cell=c=>`<w:tc><w:tcPr><w:tcW w:w="${colW}" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>${c?
    wP("",{jc:"center",before:60,after:60,keepNext:true,raw:c.img})+wP(c.cap,{jc:"center",italic:true,sz:18,after:60}):wP("",{after:0})}</w:tc>`;
  let rows="";
  for(let i=0;i<cells.length;i+=2) rows+=`<w:tr><w:trPr><w:cantSplit/><w:trHeight w:val="${rowH||ROW_H}" w:hRule="atLeast"/></w:trPr>${cell(cells[i])}${cell(cells[i+1])}</w:tr>`;
  const nb=["top","left","bottom","right","insideH","insideV"].map(x=>`<w:${x} w:val="nil"/>`).join("");
  return `<w:tbl><w:tblPr><w:tblW w:w="${BODY_W}" w:type="dxa"/><w:jc w:val="center"/><w:tblBorders>${nb}</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid><w:gridCol w:w="${colW}"/><w:gridCol w:w="${colW}"/></w:tblGrid>${rows}</w:tbl>`; }

/* photo normalising: apply phone orientation, shrink to 1600 px, re-encode */
async function docPhoto(blob){
  let bmp; try{ bmp=await createImageBitmap(blob,{imageOrientation:"from-image"}); }catch(e){ bmp=await createImageBitmap(blob); }
  const s=Math.min(1,1600/Math.max(bmp.width,bmp.height)); const W=Math.max(1,Math.round(bmp.width*s)), H=Math.max(1,Math.round(bmp.height*s));
  const c=document.createElement("canvas"); c.width=W; c.height=H; const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,W,H); g.drawImage(bmp,0,0,W,H);
  if(bmp.close) bmp.close();
  const out=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("photo encode failed")),"image/jpeg",0.85)); c.width=c.height=1;
  return {bytes:new Uint8Array(await out.arrayBuffer()),w:W,h:H}; }
/* what a photo shows: category = section name, text = the finding written for that question (or the question itself) */
function photoCtx(J,p){ const qs=J.qs||LIB; const b=p.scope==="site"?null:boilerOf2(J,p.scope);
  if(p.tag==="Nameplate") return {cat:"Nameplate",text:"Boiler "+((b||{}).no||"")+" nameplate"};
  const fm=/^(FuelSample|FuelAnalysis|FuelStorage)(?:_(.+))?$/.exec(p.tag||"");
  if(fm){ const f=(J.fuels||[]).find(x=>x.id===fm[2]); return {cat:"Fuel",text:FUEL_PHOTOS.find(x=>x[0]===fm[1])[1]+(f&&f.type?" - "+f.type:"")}; }
  const secs=p.scope==="site"?(qs.site||[]):(b?setOfB(qs,b):[]); let hit=null;
  if(p.qid) for(const sc of secs) for(const it of sc.items) if(!hit&&it.id===p.qid) hit=[sc,it];
  for(const sc of secs) for(const it of sc.items) if(!hit&&it.t===p.tag) hit=[sc,it];
  if(hit){ const f=lines(findingOf(hit[1],J.answers[p.scope+"|"+hit[1].id]||{}))[0]; return {cat:cleanSec(hit[0].section),text:f||p.label||qText(hit[1])}; }
  if(b) for(const x of b.extras||[]) for(const i of x.items) if("X"+i.id===p.tag){ const f=(i.s==="Defect"||i.s==="OK")?lines(i.f)[0]:""; return {cat:cleanSec(x.name),text:f||(x.name+" - "+i.title)}; }
  return {cat:"Photo",text:p.label||String(p.tag||"Photo").replace(/([a-z])([A-Z])/g,"$1 $2")}; }
function photoCaption(J,p){ let t=String(p.caption||"").trim()||photoCtx(J,p).text;
  if(t.length>CAP_MAX){ t=t.slice(0,CAP_MAX); t=t.slice(0,Math.max(t.lastIndexOf(" "),CAP_MAX-40))+"..."; } return t; }
const camel=(t,n)=>String(t||"").replace(/(\d)[.,](\d)/g,"$1\u0001$2").split(/[^A-Za-z0-9\u0001]+/).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join("").slice(0,n).replace(/\u0001/g,".").replace(/\.+$/,"");
function photoFileName(J,p,seq){ const c=photoCtx(J,p); const d=new Date(p.created||Date.now());
  const ymd=String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  const who=p.scope==="site"?"Site":"B"+clean((boilerOf2(J,p.scope)||{}).no||"");
  return [camel(c.cat,28)||"Photo",camel(String(p.caption||"").trim()||c.text,48)||"Photo",who,clean(J.customer&&J.customer.name),ymd,String(seq).padStart(2,"0")].join("_")+".jpg"; }
function photoOrder(J,photos){ // per boiler: nameplate, questionnaire order, additional equipment; site: fuels, then questionnaire order
  const rank={}; let n=0; const qs=J.qs||LIB;
  J.boilers.forEach(b=>{ rank[b.id+"|Nameplate"]=n++;
    setOfB(qs,b).forEach(sc=>sc.items.forEach(it=>{ const k=b.id+"|"+it.t; if(!(k in rank)) rank[k]=n++; }));
    (b.extras||[]).forEach(x=>x.items.forEach(i=>rank[b.id+"|X"+i.id]=n++)); });
  (J.fuels||[]).forEach(f=>FUEL_PHOTOS.forEach(x=>rank["site|"+x[0]+"_"+f.id]=n++));
  (qs.site||[]).forEach(sc=>sc.items.forEach(it=>{ const k="site|"+it.t; if(!(k in rank)) rank[k]=n++; }));
  return photos.slice().sort((a,b)=>((rank[a.scope+"|"+a.tag]??1e6)-(rank[b.scope+"|"+b.tag]??1e6))||((a.created||0)-(b.created||0))); }

function boilerSentence(J,b){ const ft=boilerFuel(J,b);
  const fire=b.firing==="stoker"?"coal-fired chain grate stoker":b.firing==="biomass"?("biomass-fired"+(ft?` (${ft})`:"")):((ft?ft+"-fired":"oil / gas-fired")+" burner");
  let t=`Boiler ${b.no||""} is a ${[b.make,b.model].filter(Boolean).join(" ")||"boiler"}`.replace(/ is a boiler$/," is a");
  t+=` ${fire} boiler`;
  const parts=[]; if(b.capacity) parts.push(`a rated capacity of ${b.capacity} kg/h`); if(b.pressure) parts.push(`a design pressure of ${b.pressure} bar(g)`);
  if(parts.length) t+=" with "+parts.join(" and ");
  if(b.year) t+=`, manufactured in ${b.year}`; if(b.serial) t+=` (serial no. ${b.serial})`; t+=".";
  const xs=(b.extras||[]).map(x=>x.name).filter(Boolean); if(xs.length) t+=` The boiler is fitted with the following additional equipment: ${xs.join(", ")}.`;
  return t; }
function fuelRows(f){ const rows=[]; if(f.type) rows.push(["Fuel type",f.type]);
  (FUEL_FIELDS[f.cat]||[]).concat(FUEL_COMMON_END).forEach(([k,l])=>{ if(f[k]) rows.push([l,f[k]]); });
  return rows; }

async function buildDocx(J,prog){
  prog=prog||(()=>{}); const c=J.customer||{}; const prep=J.prepared||{};
  const custLine=[c.name,c.site].filter(Boolean).join(" - ");
  // ---- photos: each one is printed where it belongs (question, fuel, nameplate); leftovers go to a short chapter at the end ----
  const media=[]; let fig=0, rid=0, did=900000000, done_n=0;
  const allPh=photoOrder(J,(await photosOf(J.id)).filter(p=>p.include)); const total=allPh.length;
  const phBy={}; allPh.forEach(p=>{ const k=p.scope+"|"+p.tag; (phBy[k]=phBy[k]||[]).push(p); });
  const M=reportModel(J,new Set(Object.keys(phBy)));
  const placed=new Set();
  const mkCell=async(p,bw,bh)=>{ done_n++; prog(`Preparing photo ${done_n} of ${total}...`); placed.add(p);
    let ph; try{ ph=await docPhoto(p.blob); }catch(e){ return {img:wRuns("[photo could not be read]"),cap:p.filename||""}; }
    fig++; rid++; did++; const r="rIdJTPh"+rid; media.push({rid:r,name:`media/jtphoto${rid}.jpg`,bytes:ph.bytes});
    let cx=bw, cy=Math.round(bw*ph.h/ph.w); if(cy>bh){ cy=bh; cx=Math.round(bh*ph.w/ph.h); }
    await new Promise(r=>setTimeout(r,0));
    return {img:wImage(r,cx,cy,did),cap:`Figure ${fig}: ${photoCaption(J,p)}`}; };
  const photosAt=async keys=>{ const list=[]; keys.forEach(k=>(phBy[k]||[]).forEach(p=>{ if(!placed.has(p)&&!list.includes(p)) list.push(p); }));
    if(!list.length) return ""; const cells=[]; for(const p of list) cells.push(await mkCell(p,BOX_W,INL_H));
    return wPhotoGrid(cells,INL_ROW)+wP("",{after:60}); };
  // one report entry (a section for one boiler, or a site section)
  const writeEntry=async(e,scope)=>{ let h="";
    e.data.forEach(d=>h+=wBullet(d));
    if(e.inline){
      if(e.table.length) h+=wTable([e.thead].concat(e.table),[4700,BODY_W-4700],{head:true});
      if(e.find.length){ h+=wLabel("Findings"); e.find.forEach(f=>h+=wBullet(f)); }
      if(e.recs.length){ h+=wLabel("Recommendations"); e.recs.forEach(r=>h+=wBullet(r)); }
      h+=await photosAt(e.tags.map(t=>scope+"|"+t));

function b64bytes(s){ const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }

/* =====================================================================
   ZIP (write: store method; read: store + deflate)
   ===================================================================== */
const CRC=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c;}return t;})();

function zipBlob(files,type){ const enc=new TextEncoder(); const parts=[]; const central=[]; let offset=0;
  const num=(n,b)=>{const a=new Uint8Array(b);for(let i=0;i<b;i++)a[i]=(n>>>(8*i))&0xFF;return a;};
  const d=new Date(); const dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)), dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate());
  for(const f of files){ const name=enc.encode(f.name); const crc=crc32(f.data);
    const lh=[num(0x04034b50,4),num(20,2),num(0x0800,2),num(0,2),num(dt,2),num(dd,2),num(crc,4),num(f.data.length,4),num(f.data.length,4),num(name.length,2),num(0,2),name];
    central.push({name,crc,size:f.data.length,offset});
    lh.forEach(a=>{parts.push(a);offset+=a.length;}); parts.push(f.data); offset+=f.data.length; }
  const cdStart=offset; let cdLen=0;
  for(const c of central){ const cd=[num(0x02014b50,4),num(20,2),num(20,2),num(0x0800,2),num(0,2),num(dt,2),num(dd,2),num(c.crc,4),num(c.size,4),num(c.size,4),num(c.name.length,2),num(0,2),num(0,2),num(0,2),num(0,2),num(0,4),num(c.offset,4),c.name];
    cd.forEach(a=>{parts.push(a);cdLen+=a.length;}); }
  parts.push(num(0x06054b50,4),num(0,2),num(0,2),num(central.length,2),num(central.length,2),num(cdLen,4),num(cdStart,4),num(0,2));
  return new Blob(parts,{type}); }
async function unzip(buf){ const u8=new Uint8Array(buf), dv=new DataView(buf); let e=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-65558);i--) if(dv.getUint32(i,true)===0x06054b50){ e=i; break; }
  if(e<0) throw new Error("not a ZIP file");
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const out={}; const dec=new TextDecoder();
  for(let k=0;k<n;k++){ if(dv.getUint32(p,true)!==0x02014b50) throw new Error("damaged ZIP");
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nlen)); p+=46+nlen+elen+clen;
    if(name.endsWith("/")) continue;
    const start=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true); const data=u8.slice(start,start+csize);
    if(method===0) out[name]=data;
    else if(method===8) out[name]=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
    else throw new Error("unsupported ZIP compression in "+name); }
  return out; }

   ONEDRIVE (5.4) — manual "Save to OneDrive" / "Open from OneDrive".
   Same Microsoft sign-in as the FSO app (same Azure Client ID, same
   github.io origin, so an existing FSO sign-in is reused silently).
   Layout in the signed-in user's OneDrive:
     JT Audit/library.json                    questions + suggestion lists
     JT Audit/reports/index.json              list shown under "Open from OneDrive"
     JT Audit/reports/<jobId>/report.json     the report (no photo bytes)
     JT Audit/reports/<jobId>/photos/<id>.jpg one file per photo

const MSAL_SRC="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.18.0/lib/msal-browser.min.js";
const MSAL_SRI="sha384-QBA+VxDY+Z8Frcz3oXcumRktHmg8ho2te4V7RBWyGkc44FBa0NJRv6AKqvWpLRrX";
const GRAPH="https://graph.microsoft.com/v1.0";
const CLOUD_ROOT="JT Audit";
const CLOUD_SCOPES=["Files.ReadWrite","User.Read"];
let CLOUD={clientId:""}, msalApp=null, cloudAcct=null, cloudBusy=false;

async function loadCloudCfg(){
  CLOUD=await kvGet("cloud",{clientId:""});
  if(!CLOUD.clientId){ // same github.io origin as the FSO app: offer its Client ID
    try{ const f=JSON.parse(localStorage.getItem("fso_pwa_v1")||"null");
      const id=f&&f.settings&&f.settings.oneDrive&&f.settings.oneDrive.clientId;
      if(id&&/^[0-9a-f-]{36}$/i.test(id)){ CLOUD.clientId=id; CLOUD.fromFso=true; await kvPut("cloud",CLOUD); } }catch(e){}
  }
}
const isCellular=()=>{ const c=navigator.connection; return !!(c&&c.type==="cellular"); };
const isOnline=()=>navigator.onLine!==false;
const isStandalone=()=>(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
const redirectUri=()=>location.origin+location.pathname;
const mb=n=>(n/1048576).toFixed(1)+" MB";

function loadMsal(){ if(window.msal) return Promise.resolve();
  return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=MSAL_SRC; s.integrity=MSAL_SRI; s.crossOrigin="anonymous";
    s.onload=()=>res(); s.onerror=()=>rej(new Error("Could not load the Microsoft sign-in library - check your connection"));
    document.head.appendChild(s); }); }
async function cloudInit(){
  if(msalApp) return true;
  if(!CLOUD.clientId) return false;
  await loadMsal();
  msalApp=new msal.PublicClientApplication({auth:{clientId:CLOUD.clientId,authority:"https://login.microsoftonline.com/consumers",redirectUri:redirectUri()},
    cache:{cacheLocation:"localStorage"}});
  await msalApp.initialize();
  try{ const r=await msalApp.handleRedirectPromise(); if(r&&r.account) cloudAcct=r.account; }catch(e){ console.warn("redirect",e); }
  if(!cloudAcct){ const a=msalApp.getAllAccounts(); if(a.length) cloudAcct=a[0]; }

// interactive=false: never send the engineer to a sign-in page (background uploads)
async function cloudToken(interactive){
  if(!await cloudInit()) throw new Error("Set up OneDrive first (Home > OneDrive)");
  if(!cloudAcct){ if(!interactive) throw new Error("Not signed in");
    if(isStandalone()){ await msalApp.loginRedirect({scopes:CLOUD_SCOPES}); throw new Error("Opening Microsoft sign-in..."); }
    const r=await msalApp.loginPopup({scopes:CLOUD_SCOPES}); cloudAcct=r.account; }
  try{ return (await msalApp.acquireTokenSilent({scopes:CLOUD_SCOPES,account:cloudAcct})).accessToken; }
  catch(e){ if(!interactive) throw e;
    if(isStandalone()){ await msalApp.acquireTokenRedirect({scopes:CLOUD_SCOPES,account:cloudAcct}); throw new Error("Opening Microsoft sign-in..."); }
    return (await msalApp.acquireTokenPopup({scopes:CLOUD_SCOPES,account:cloudAcct})).accessToken; }
}
// Graph path for "JT Audit/<segments>" — every segment encoded
const cp=(...seg)=>"/me/drive/root:/"+[CLOUD_ROOT,...seg].map(encodeURIComponent).join("/");
async function gx(method,path,o){ o=o||{};
  const h=Object.assign({Authorization:"Bearer "+await cloudToken(o.interactive!==false)},o.headers||{});
  let body=o.body; if(o.json!==undefined){ h["Content-Type"]="application/json"; body=JSON.stringify(o.json); }
  const r=await fetch(GRAPH+path,{method,headers:h,body});
  if(!r.ok){ if(o.okMissing&&r.status===404) return null;
    let m=""; try{ const j=await r.json(); m=(j.error&&(j.error.code+": "+j.error.message))||""; }catch(e){}
    const e=new Error("OneDrive "+r.status+(m?" - "+m:"")); e.status=r.status; throw e; }
  if(o.blob) return r.blob();
  if(r.status===204) return null;
  const ct=r.headers.get("content-type")||""; return ct.includes("json")?r.json():r.text();
}
async function getJson(...seg){ const t=await gx("GET",cp(...seg)+":/content",{okMissing:true});
  return t==null?null:(typeof t==="string"?JSON.parse(t):t); }
const putJson=(obj,...seg)=>gx("PUT",cp(...seg)+":/content",{body:new TextEncoder().encode(JSON.stringify(obj)),headers:{"Content-Type":"application/json"}});
async function putBlob(blob,o,...seg){ // simple PUT up to 4 MB, upload session above that
  if(blob.size<=4*1048576) return gx("PUT",cp(...seg)+":/content",{body:blob,headers:{"Content-Type":blob.type||"image/jpeg"},interactive:o.interactive});
  const s=await gx("POST",cp(...seg)+":/createUploadSession",{json:{item:{"@microsoft.graph.conflictBehavior":"replace"}},interactive:o.interactive});
  const CH=32*327680; // 10 MiB, a multiple of 320 KiB
  for(let i=0;i<blob.size;i+=CH){ const end=Math.min(i+CH,blob.size);
    const r=await fetch(s.uploadUrl,{method:"PUT",headers:{"Content-Range":`bytes ${i}-${end-1}/${blob.size}`},body:blob.slice(i,end)});
    if(!r.ok&&r.status!==202) throw new Error("OneDrive upload failed ("+r.status+")"); }

async function rmCloud(...seg){ try{ await gx("DELETE",cp(...seg),{okMissing:true}); }catch(e){ console.warn("delete",seg,e); } }

  CLOUD={clientId:v}; await kvPut("cloud",CLOUD); msalApp=null; cloudAcct=null; alert("Client ID saved."); rerender(); }
async function cloudSignIn(){ if(!isOnline()){ alert("You are offline."); return; }
  try{ await cloudToken(true); rerender(); }catch(e){ if(!/Opening Microsoft/.test(e.message)) alert("Sign-in failed: "+e.message); } }
async function cloudSignOut(){ if(!confirm("Sign out of OneDrive in this app?\n(If the FSO app on this device uses the same account, it is signed out too.)"))return;
  try{ await cloudInit(); if(cloudAcct) await msalApp.clearCache({account:cloudAcct}); }catch(e){} cloudAcct=null; rerender(); }

/* ---------- Report status line (job menu) ---------- */
async function cloudCard(){
  const ph=await photosOf(job.id), waiting=ph.filter(p=>!p.cloudUp);
  const c=job.cloud; let line;
  if(!c) line="Not on OneDrive yet.";
  else { line="Saved to OneDrive "+new Date(c.at).toLocaleString()+".";
    if(job.updated>c.localAt) line+=" <b>Changed since then.</b>"; }
  if(c&&waiting.length) line+=` ${waiting.length} photo(s) waiting for Wi-Fi.`;
  return `<div class="card"><h2>&#9729; OneDrive</h2><div class="sub" id="cloudLine">${line}</div>
    <button class="btn" onclick="cloudSaveJob()">Save to OneDrive</button>
    ${c&&waiting.length?`<button class="btn sec small" onclick="cloudSaveJob(true)">Upload photos now</button>`:""}
    <div class="status" id="cloudStatus"></div></div>`; }
const cst=t=>{ const e=$("cloudStatus"); if(e) e.innerHTML=t; };

function photoMeta(p){ return {id:p.id,scope:p.scope,tag:p.tag,qid:p.qid||"",label:p.label||"",include:!!p.include,caption:p.caption||"",
  filename:p.filename||"",created:p.created||0,type:(p.blob&&p.blob.type)||"image/jpeg",size:(p.blob&&p.blob.size)||0,up:!!p.cloudUp}; }
function cleanJob(J){ const c=JSON.parse(JSON.stringify(J)); delete c.cloud; return c; }

/* ---------- Save to OneDrive ---------- */
async function cloudSaveJob(forcePhotos){
  if(cloudBusy) return; if(!isOnline()){ alert("You are offline - save to OneDrive when you have signal."); return; }
  cloudBusy=true;
  try{ await saveJob(); cst("Checking OneDrive...");
    const cloud=await getJson("reports",job.id,"report.json");
    if(cloud&&(!job.cloud||cloud.savedAt>job.cloud.at)&&
       !confirm(`The OneDrive copy of this report was saved ${new Date(cloud.savedAt).toLocaleString()} from another device, after this device last synced it.\n\nReplace it with THIS device's version?\n\n(Cancel = change nothing. Use "Open from OneDrive" on the home screen to get the other version.)`)){ cst("Nothing changed."); return; }
    const ph=await photosOf(job.id), pend=ph.filter(p=>!p.cloudUp);
    let up=pend.length>0&&(!isCellular()||forcePhotos===true);
    if(pend.length&&isCellular()&&forcePhotos!==true)
      up=confirm(`You are on mobile data.\n\nUpload ${pend.length} photo(s) (${mb(pend.reduce((s,p)=>s+(p.blob?p.blob.size:0),0))}) now?\n\nOK = upload now.\nCancel = save the report text now, photos go up by themselves on Wi-Fi.`);
    if(up) await uploadPhotos(job.id,pend,true,(i,n)=>cst(`Uploading photo ${i} of ${n}...`));
    const keep=new Set(ph.map(p=>p.id));
    if(cloud&&Array.isArray(cloud.photos)) for(const p of cloud.photos) if(!keep.has(p.id)) await rmCloud("reports",job.id,"photos",p.id+".jpg");
    cst("Saving report...");
    const savedAt=Date.now(), now=await photosOf(job.id);
    await putJson({format:"jt-audit-cloud",v:1,app:APP_VER,schema:QS_VER,savedAt,job:cleanJob(job),photos:now.map(photoMeta)},"reports",job.id,"report.json");
    await indexSet(job.id,{customer:job.customer.name||"",reportNo:job.customer.reportNo||"",date:job.customer.date||"",
      boilers:job.boilers.length,photos:now.length,savedAt});
    job.cloud={at:savedAt,localAt:job.updated}; await put("jobs",job);
    const left=now.filter(p=>!p.cloudUp).length;
    cst("&#10004; Saved to OneDrive."+(left?` ${left} photo(s) will upload on Wi-Fi.`:""));
    setTimeout(()=>{ if(stack.length&&stack[stack.length-1][0]===jobMenu) rerender(); },1500);
  }catch(e){ cst(/Opening Microsoft/.test(e.message)?"Opening Microsoft sign-in...":"Save failed: "+esc(e.message)); }
  finally{ cloudBusy=false; }
}
async function uploadPhotos(jobId,list,interactive,prog){ let i=0;
  for(const p of list){ prog&&prog(++i,list.length);
    if(!p.blob) continue;
    await putBlob(p.blob,{interactive},"reports",jobId,"photos",p.id+".jpg");
    p.cloudUp=true; await put("photos",p); } }
async function indexSet(id,entry){ const ix=(await getJson("reports","index.json"))||{v:1,reports:{}};
  ix.reports=ix.reports||{}; if(entry) ix.reports[id]=entry; else delete ix.reports[id]; await putJson(ix,"reports","index.json"); }

// Photos left waiting go up on their own once on Wi-Fi (silent; never prompts for sign-in)
async function cloudFlush(){
  if(cloudBusy||!isOnline()||isCellular()||!CLOUD.clientId) return;
  const jobs=(await all("jobs")).filter(j=>j.cloud); if(!jobs.length) return;
  cloudBusy=true;
  try{ for(const J of jobs){ const pend=(await photosOf(J.id)).filter(p=>!p.cloudUp); if(!pend.length) continue;
      if(!await cloudInit()||!cloudAcct) return;
      await uploadPhotos(J.id,pend,false);
      const cloud=await getJson("reports",J.id,"report.json"); // mark them uploaded in the cloud copy
      if(cloud&&Array.isArray(cloud.photos)){ const ids=new Set(pend.map(p=>p.id)); cloud.photos.forEach(p=>{ if(ids.has(p.id)) p.up=true; });
        await putJson(cloud,"reports",J.id,"report.json"); } }
  }catch(e){ console.warn("photo upload",e); }
  finally{ cloudBusy=false; }
}

/* ---------- Open from OneDrive ---------- */
async function cloudList(_k){
  screen("Open from OneDrive",'<div class="card"><div class="status" id="cl">Loading the list from OneDrive...</div></div>',null,_k);
  if(!isOnline()){ $("cl").textContent="You are offline."; return; }
  try{ let ix=await getJson("reports","index.json");
    const rows=Object.entries((ix&&ix.reports)||{}).sort((a,b)=>b[1].savedAt-a[1].savedAt);
    const local={}; (await all("jobs")).forEach(j=>local[j.id]=j);
    if(!rows.length){ $("cl").innerHTML="No reports on OneDrive yet. Open a report and tap <b>Save to OneDrive</b>."; return; }
    $("view").innerHTML=`<p class="hint">Reports saved to OneDrive from any of your devices. Tap one to open it here.</p>`+rows.map(([id,r])=>{
      const L=local[id]; let b='<span class="badge">not on this device</span>';
      if(L){ if(L.cloud&&L.cloud.at>=r.savedAt) b=L.updated>L.cloud.localAt?'<span class="badge part">changed here</span>':'<span class="badge done">up to date</span>';
             else b='<span class="badge part">newer on OneDrive</span>'; }
      return `<div class="list-item"><div class="grow tap" onclick="cloudOpen('${esc(id)}')"><div class="title">${esc(r.customer)||"(no customer name)"}</div>
        <div class="sub">${esc(r.reportNo)||"no report no."} &middot; ${r.boilers||0} boiler(s) &middot; ${r.photos||0} photo(s) &middot; saved ${new Date(r.savedAt).toLocaleString()}</div>
        <div style="margin-top:6px">${b}</div></div>
        <button class="btn sec small" title="Delete from OneDrive" onclick="cloudDelete('${esc(id)}')">&#128465;</button></div>`; }).join("")+
      '<div class="status" id="cloudStatus"></div>';
  }catch(e){ const el=$("cl"); if(el) el.textContent=/Opening Microsoft/.test(e.message)?"Opening Microsoft sign-in...":"Could not load: "+e.message; }
}
async function cloudOpen(id){
  if(cloudBusy) return; if(!/^[A-Za-z0-9]+$/.test(id)){ alert("Invalid report id"); return; }
  cloudBusy=true;
  try{ cst("Downloading report...");
    const c=await getJson("reports",id,"report.json"); if(!c||!c.job) throw new Error("report.json not found on OneDrive");
    const L=await get("jobs",id);
    if(L&&(!L.cloud||L.updated>L.cloud.localAt)&&
       !confirm("This device has changes to this report that are not on OneDrive.\n\nReplace them with the OneDrive copy?")){ cst(""); return; }
    const mine=await photosOf(id), have=new Map(mine.map(p=>[p.id,p]));
    const list=(c.photos||[]).filter(p=>p&&/^[A-Za-z0-9]+$/.test(String(p.id)));
    const need=list.filter(p=>p.up&&!have.has(p.id));
    if(need.length&&isCellular()&&!confirm(`You are on mobile data.\n\nDownload ${need.length} photo(s) (${mb(need.reduce((s,p)=>s+(p.size||0),0))}) now?`)){ cst("Cancelled - open it again on Wi-Fi."); return; }
    let i=0;
    for(const p of need){ cst(`Downloading photo ${++i} of ${need.length}...`);
      const blob=await gx("GET",cp("reports",id,"photos",p.id+".jpg")+":/content",{blob:true,okMissing:true}); if(!blob) continue;
      have.set(p.id,{id:p.id,jobId:id,blob:new Blob([blob],{type:p.type||"image/jpeg"})}); }
    const wanted=new Set(list.map(p=>p.id));
    for(const p of mine) if(!wanted.has(p.id)) await del("photos",p.id);
    for(const p of list){ const r=have.get(p.id); if(!r||!r.blob) continue;
      await put("photos",{id:p.id,jobId:id,scope:p.scope,tag:p.tag,qid:p.qid||"",label:p.label||"",include:p.include!==false,
        caption:p.caption||"",filename:p.filename||"",blob:r.blob,created:p.created||Date.now(),cloudUp:true}); }
    const J=fixJob(Object.assign(c.job,{id})); const t=Date.now(); J.updated=t; J.cloud={at:c.savedAt,localAt:t};
    await put("jobs",J);
    const missing=list.filter(p=>!p.up).length;
    if(missing) alert(`${missing} photo(s) of this report haven't been uploaded from the other device yet (it is waiting for Wi-Fi). Open it again later to get them.`);
    cloudBusy=false; stack.length=1; await openJob(id);
  }catch(e){ cst(/Opening Microsoft/.test(e.message)?"Opening Microsoft sign-in...":"Open failed: "+esc(e.message)); }
  finally{ cloudBusy=false; }
}
async function cloudDelete(id){
  if(!/^[A-Za-z0-9]+$/.test(id)) return;
  if(!confirm("Delete this report and its photos from OneDrive?\n\nThe copy on this device (if any) is NOT deleted."))return;
  try{ cst("Deleting..."); await rmCloud("reports",id); await indexSet(id,null);
    const L=await get("jobs",id); if(L&&L.cloud){ delete L.cloud; await put("jobs",L); }
    for(const p of await photosOf(id)) if(p.cloudUp){ p.cloudUp=false; await put("photos",p); }
    rerender(); }catch(e){ cst("Delete failed: "+esc(e.message)); }
}

/* ---------- Questions & lists ---------- */
async function cloudSaveLib(){ if(!isOnline()){ alert("You are offline."); return; }
  const st=$("libCloud"); st.textContent="Saving...";
  try{ await putJson({format:"jt-audit-library",v:1,savedAt:Date.now(),lib:LIB,lists:LISTS},"library.json");
    st.innerHTML="&#10004; Questions &amp; lists saved to OneDrive."; }
  catch(e){ st.textContent=/Opening Microsoft/.test(e.message)?"Opening Microsoft sign-in...":"Save failed: "+e.message; } }
async function cloudLoadLib(){ if(!isOnline()){ alert("You are offline."); return; }
  const st=$("libCloud"); st.textContent="Loading...";
  try{ const v=await getJson("library.json"); if(!v||!v.lib) throw new Error("no questions saved on OneDrive yet");
    if(!confirm(`Replace this device's questions and lists with the OneDrive copy saved ${new Date(v.savedAt).toLocaleString()}?`)){ st.textContent=""; return; }
    await applyLibrary(v.lib,v.lists); st.innerHTML="&#10004; Loaded from OneDrive."; }
  catch(e){ st.textContent=/Opening Microsoft/.test(e.message)?"Opening Microsoft sign-in...":"Load failed: "+e.message; } }

/* ---------- start-up ---------- */
async function cloudBoot(){
  await loadCloudCfg();
  // back from the Microsoft sign-in page, or already signed in (e.g. via the FSO app)
  const back=/[#&?](code|error)=/.test(location.hash+location.search);
  if(CLOUD.clientId&&(back||isOnline())){ try{ await cloudInit(); }catch(e){ console.warn("cloud init",e); } }
  if(back&&cloudAcct) setTimeout(()=>alert("Signed in to OneDrive as "+cloudAcct.username),300);
  const kick=()=>setTimeout(cloudFlush,2000);
  window.addEventListener("online",kick);
  if(navigator.connection&&navigator.connection.addEventListener) navigator.connection.addEventListener("change",kick);
  kick();
}

/* =====================================================================
   OFFLINE (only when hosted on https, e.g. GitHub Pages - ignored for a local file)
   ===================================================================== */
if(location.protocol==="https:"||location.hostname==="localhost"){
  const l=document.createElement("link"); l.rel="manifest"; l.href="manifest.json"; document.head.appendChild(l);
  const ic=document.createElement("link"); ic.rel="apple-touch-icon"; ic.href="icon-192.png"; document.head.appendChild(ic);
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
}

/* =====================================================================
   BOOT
   ===================================================================== */
idb().then(loadSettings).then(loadLib).then(loadLists).then(home).then(()=>cloudBoot().catch(e=>console.warn("cloud",e)))
  .catch(e=>{ $("view").innerHTML='<div class="card">Storage error: '+esc(e&&e.message||String(e))+'</div>'; });
</script>
