<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1F4E79">
<title>JT Boiler Audit</title>
<style>
:root{--jt:#1F4E79;--bg:#f4f6f9;--card:#fff;--line:#d8dee7;--ok:#2e7d32;--bad:#c62828;--na:#757575;--amber:#ef6c00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#222;padding-bottom:96px}
header{position:sticky;top:0;z-index:5;background:var(--jt);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
header .back{font-size:22px;border:none;background:none;color:#fff;padding:4px 8px}
header h1{font-size:17px;margin:0;flex:1;line-height:1.2}
.wrap{padding:12px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:15px;color:var(--jt)}
.card.tap{cursor:pointer}
label{display:block;font-size:13px;color:#444;margin:10px 0 4px}
input[type=text],input[type=email],input[type=number],input[type=date],textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff;font-family:inherit}
textarea{min-height:74px}
.btn{display:inline-block;border:none;border-radius:8px;padding:12px 16px;font-size:15px;background:var(--jt);color:#fff;margin:6px 6px 0 0;font-family:inherit}
.btn.sec{background:#e6ebf2;color:var(--jt)}
.btn.warn{background:var(--bad)}
.btn.ok{background:var(--ok)}
.btn.small{padding:8px 12px;font-size:13px}
.btn.wide{width:100%;margin:8px 0 0}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.list-item .grow{flex:1;min-width:0}
.list-item .title{font-weight:bold;font-size:15px}
.list-item .sub{font-size:12.5px;color:#666;margin-top:3px}
.list-item.extra{border-left:4px solid var(--amber)}
.list-item.fuel{border-left:4px solid var(--jt)}
.badge{font-size:11px;padding:3px 8px;border-radius:10px;background:#e6ebf2;color:var(--jt);white-space:nowrap}
.badge.done{background:#e2f2e3;color:var(--ok)}
.badge.part{background:#fdeedd;color:var(--amber)}
.mark-ok{color:var(--ok);font-size:20px}.mark-no{color:var(--bad);font-size:20px}
.seg{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;padding:11px 4px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:14px;font-family:inherit}
.seg button.on-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.seg button.on-def{background:var(--bad);color:#fff;border-color:var(--bad)}
.seg button.on-na{background:var(--na);color:#fff;border-color:var(--na)}
.seg button.on-skip{background:#455a64;color:#fff;border-color:#455a64}
.prio{display:flex;gap:6px;margin-top:6px}
.prio button{flex:1;padding:9px 4px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:13px;font-family:inherit}
.prio button.on-H{background:var(--bad);color:#fff;border-color:var(--bad)}
.prio button.on-M{background:var(--amber);color:#fff;border-color:var(--amber)}
.prio button.on-L{background:#607d8b;color:#fff;border-color:#607d8b}
.prio button.on-N{background:var(--na);color:#fff;border-color:var(--na)}
.panel{border-top:1px dashed var(--line);margin-top:10px;padding-top:4px}
.addc{margin-top:10px;border:1px dashed var(--jt);background:#f3f7fc;color:var(--jt);border-radius:8px;padding:10px;width:100%;font-size:14px;font-family:inherit}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ph{width:104px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.ph img{width:104px;height:80px;object-fit:cover;display:block}
.ph .cap{width:100%;border:none;border-top:1px solid var(--line);font-size:11px;padding:5px}
.ph .inc{display:flex;align-items:center;font-size:11px;padding:4px 5px;gap:4px;border-top:1px solid var(--line)}
.ph .del{width:100%;border:none;background:#fbe9e7;color:var(--bad);font-size:11px;padding:5px}
.hint{font-size:12px;color:#777;margin-top:6px}
.progress{height:6px;background:#e0e6ee;border-radius:3px;margin-top:8px;overflow:hidden}
.progress div{height:100%;background:var(--jt)}
.footer-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px;gap:8px;z-index:5}
.footer-nav .btn{flex:1;margin:0;text-align:center}
.qnum{font-size:12px;color:#888}
h3.q{font-size:16px;margin:4px 0 2px}
.suggest{background:#eef3f9;border:1px dashed #b7c6da;border-radius:8px;padding:10px;font-size:13px;margin-top:8px}
.suggest .use{color:var(--jt);font-weight:bold;border:none;background:none;padding:6px 0 0;font-size:13px;font-family:inherit}
.center{text-align:center}
.big{font-size:17px;padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#e6ebf2;color:var(--jt);border-radius:16px;padding:6px 10px;margin:4px 4px 0 0;font-size:13px}
.chip button{border:none;background:none;color:var(--bad);font-size:14px;padding:0}
.genbox{background:#fff;border:2px solid var(--jt);border-radius:12px;padding:16px;margin-bottom:12px}
.status{font-size:14px;margin-top:10px;color:var(--jt);min-height:20px}
.warnbox{background:#fff4e5;border:1px solid #f5c58a;border-radius:8px;padding:10px;font-size:13px;margin-top:8px}
.dist{display:flex;gap:6px;margin-top:6px}
.dist input{flex:1}
</style>
</head>
<body>
<header><button class="back" id="backBtn" style="display:none">&#8592;</button><h1 id="hTitle">JT Boiler Audit</h1></header>
<div class="wrap" id="view"></div>
<div class="footer-nav" id="fnav" style="display:none"></div>

<script>
"use strict";
const APP_VER = "5.1";
const QDB = {"shared":[{"section":"Boiler Water Level (report 6.1)","items":[{"q":"Gauge glass / sight glass condition","f":"Sight glass not clearly visible / leaking and needs replacement.","r":"Replace/repair sight glass. The gauge glass should be blown down once per shift to ensure it is working correctly and the standpipes do not become blocked with scale.","p":"High","t":"GaugeGlassSight","d":"check"},{"q":"Gauge glass blown down each shift?","f":"Gauge glasses are not blown down at the beginning of each shift.","r":"The gauge glasses should be blown down once per shift to ensure that they are working correctly and that the standpipes do not become blocked with scale.","p":"Medium","t":"GaugeGlassBlown","d":"check"},{"q":"Water level control type & condition","f":"Water level Mobrey switches badly worn / water level control not ideal with slow response.","r":"Upgrade the water level control system by installing a Spirax LP21 probe, controller and a VSD for the feedwater pump for modulating control of the water level.","p":"High","t":"WaterLevelControl","d":"check","opts":["Mobrey","Spirax LP20 probe","Spirax LP21 probe","K-Tek probe"]},{"q":"Extra low water cut-out condition & test","f":"Extra low water Mobrey worn / extra low water lock-out could not be verified.","r":"Upgrade the extra low water protection by installing a Spirax LP40 probe and extra low water controller. Blow down every shift to check that the boiler trips and locks out at extra low water level.","p":"High","t":"ExtraLowWater","d":"check","opts":["Mobrey","Spirax LP30","Spirax LP40"]},{"q":"Level control blowdown pipework","f":"Mobrey/level control blowdown pipework bent or damaged; blowdown not possible.","r":"Replace/repair the sight glass and level control blowdown pipework as soon as possible.","p":"High","t":"LevelControlBlowdown","d":"check"},{"q":"Low / extra low / high water alarms (audible + visual)","f":"Alarms for low and high water levels not correct: no audible low water alarm / no separate extra low alarm / no record kept of alarm tests.","r":"All alarms, audible and visual, should be recorded. If the water level in the gauge glass is correct and a low water alarm persists, the level controls should be checked; if the level remains low, check the feedwater pumps.","p":"High","t":"LowExtraLow","d":"check"},{"q":"Records of alarm tests available?","f":"Records of alarm tests could not be provided for review.","r":"Record all alarm tests in the daily logbook and retain records for review.","p":"Medium","t":"RecordsOfAlarm","d":"check"},{"q":"Feedwater pump condition & automation","f":"Feedwater pump faulty / cannot keep up with steam demand / no automation of feedwater pumps.","r":"Urgent attention should be paid to malfunctioning boiler feedwater pumps and to the automation controls of the feedwater pumps.","p":"High","t":"FeedwaterPumpCondition","d":"check"},{"q":"Feedwater pump protection installed?","f":"No feedwater pump protection is installed on the pumps.","r":"Install feedwater pump protection to prevent pump damage.","p":"Medium","t":"FeedwaterPumpProtection","d":"check"},{"q":"Feedwater flow meter installed & working","f":"No feedwater flow meter installed / feedwater meter not working.","r":"Install a feedwater flow meter (magnetic type recommended) for each boiler to monitor the amount of water used per boiler.","p":"Medium","t":"FeedwaterFlowMeter","d":"check"},{"q":"Cabling to level switches / transmitters secure","f":"Cabling to feedwater pumps, level switches and/or transmitters is not secure and safe.","r":"Cabling to feedwater pumps, level switches and/or transmitters should be secured and made safe.","p":"Medium","t":"CablingToLevel","d":"check"}]},{"section":"TDS & Blowdown (report 5.2 per boiler)","items":[{"q":"Automatic TDS control installed & working","f":"Boiler does not have automatic TDS control / TDS system not working due to seized valves or faulty controller.","r":"Automatic TDS controls and water sample coolers need to be installed/upgraded on the boiler. TDS levels must be maintained between 2500-3000 to prevent water carry-over to the process.","p":"High","t":"AutomaticTdsControl","d":"check"},{"q":"TDS reading taken (record value)","f":"TDS measurement was extremely high, measured above specification with handheld tester.","r":"Maintain TDS between 2500-3000 by correct blowdown and dosing. Record TDS and pH for each shift in the daily logbook.","p":"High","t":"TdsReadingTaken","d":"check"},{"q":"Sample cooler installed","f":"No water sample cooler installed on the boiler.","r":"Install a water sample cooler for safe and accurate boiler water sampling.","p":"Medium","t":"SampleCoolerInstalled","d":"check"},{"q":"Blowdown valve condition & operation","f":"Boiler blowdown valve leaking / stiff / blowdown pipe blocked.","r":"Repair/replace the blowdown valve. Blowdown valve flanges must be tight with effortless action.","p":"High","t":"BlowdownValveCondition","d":"check"}]},{"section":"Valves & Mountings","items":[{"q":"Safety valves condition (leaks / test records)","f":"Steam leak on safety valves / safety valve test records not available.","r":"Replace or overhaul safety valves with steam leaks. Safety valves to be tested with the AIA inspector and documented.","p":"High","t":"SafetyValvesCondition","d":"check"},{"q":"Main steam (crown) valve","f":"Steam leak on the crown valve.","r":"Replace/repair the leaking crown valve as soon as possible.","p":"High","t":"MainSteamValve","d":"check"},{"q":"Feedwater isolating & check valves","f":"Feedwater valve / check (one-way) valve passing or seized.","r":"Replace the feedwater isolating and check valves.","p":"Medium","t":"FeedwaterIsolatingCheck","d":"check"},{"q":"Boiler pressure gauge","f":"Boiler pressure gauge faulty / not calibrated.","r":"Replace the boiler pressure gauge with a newly calibrated pressure gauge.","p":"Medium","t":"BoilerPressureGauge","d":"check"},{"q":"Pressure control instrumentation & safety pipework","f":"Copper pipes used for boiler safety instruments; does not comply with BS EN 12953. High pressure lock-out drifting from set calibration.","r":"Replace copper instrument pipework to comply with BS EN 12953. Replace/recalibrate the high pressure safety lock-out and incorporate the pressure transducer onto the new pipework.","p":"High","t":"PressureControlInstrumentation","d":"check"},{"q":"Air release valve","f":"Air release valve leaking / seized.","r":"Repair/replace the air release valve.","p":"Low","t":"AirReleaseValve","d":"check"}]},{"section":"Boiler Mechanical & Maintenance (report 5.5)","items":[{"q":"Fire tubes condition & cleaning interval","f":"Fire tubes blocked / not cleaned regularly, reducing heat transfer.","r":"Fire tubes should be cleaned regularly, ideally every three to four months, to maintain optimum heat transfer and boiler efficiency.","p":"Medium","t":"FireTubesCondition","d":"check"},{"q":"Refractory condition","f":"Refractory is cracked/damaged which leads to loss of heat and efficiency.","r":"Repair/recast the damaged refractory.","p":"High","t":"RefractoryCondition","d":"check"},{"q":"Smokebox doors, clamps & seals","f":"Smokebox door clamps/bolts missing; smokebox seals leaking.","r":"Replace all missing smokebox door clamps/bolts and repair smokebox seals. Smokebox doors must be tight.","p":"Medium","t":"SmokeboxDoorsClamps","d":"check"},{"q":"Exit flue gas temperature gauge","f":"Exit flue gas temperature gauge not working; monitoring of blocked tubes and combustion efficiency not possible.","r":"Replace the exit flue gas temperature gauge to monitor fire tube blockage and combustion efficiency.","p":"Medium","t":"ExitFlueGas","d":"check"},{"q":"Boiler instrumentation calibration","f":"Boiler instrumentation not calibrated.","r":"Calibrate or replace boiler instrumentation.","p":"Medium","t":"BoilerInstrumentationCalibration","d":"check"},{"q":"Control panel condition","f":"Control panel switches, buttons and pilot lights damaged or not working; wiring loose with risk of electrocution.","r":"Upgrade the panel with a new OEM automated control panel with HMI screen (and fan VSDs where applicable) compliant with pressure equipment regulations and EN boiler safety standards.","p":"High","t":"ControlPanelCondition","d":"check"},{"q":"Safety interlocks tested","f":"Safety interlocks could not be verified / not tested.","r":"Yearly AIA safety inspections to be done: safety chain lockouts, low water alarm and lock-out, safety valves and E-stop to be tested and documented.","p":"High","t":"SafetyInterlocksTested","d":"check"},{"q":"Statutory / AIA inspection records","f":"The AIA hot commissioning report for the setting of safety limiters was not provided for review.","r":"Provide AIA inspection and hot commissioning records. The boiler must be subjected to internal and external inspection annually as required by law.","p":"Medium","t":"StatutoryAiaInspection","d":"check"},{"q":"Maintenance schedules in place","f":"Weekly or monthly maintenance schedules could not be provided for review.","r":"Implement daily, weekly and monthly maintenance schedules for the boiler plant, steam distribution and condensate recovery equipment, and record all maintenance.","p":"Medium","t":"MaintenanceSchedulesIn","d":"check"}]}],"stoker":[{"section":"Combustion — Stoker (report 6.3)","items":[{"q":"Fuel analysis records available","f":"Fuel analysis records were not provided for review.","r":"Perform a proximate analysis, a mineral ash analysis and ash fusion temperatures at least once per coal delivery. Ensure the volatile content of fuel is within specification.","p":"Medium","t":"FuelAnalysisRecords","d":"check"},{"q":"Combustion quality (red coals off stoker end?)","f":"Incomplete combustion of fuel was occurring with red coals being discharged off the end of the stoker.","r":"Set up combustion controls, check undergrate air distribution and grate speed to ensure complete burnout before the end of the grate.","p":"High","t":"CombustionQuality","d":"check"},{"q":"Boiler maintains pressure setpoint?","f":"The boiler could not maintain the operating pressure setpoint.","r":"Investigate combustion controls, fuel quality and heating surface fouling; restore automatic control of ID and FD fans.","p":"High","t":"BoilerMaintainsPressure","d":"check"},{"q":"Stoker mat / links / link rods","f":"The stoker mat shows signs of overheating with damaged links and bent link rods; ends of link rods damaged with drifting rods and missing split pins.","r":"Replace damaged links and link rods and fit split pins. Use OEM parts only.","p":"High","t":"StokerMatLinks","d":"check"},{"q":"Grate tension","f":"The stoker mat could not be tensioned due to excessive wear on drive links.","r":"Replace worn drive links; remove a link from the stoker chain and jack the motor to correct tension.","p":"High","t":"GrateTension","d":"check"},{"q":"Stoker level / frame condition","f":"The stoker needs to be levelled in the boiler; the stoker frame shows signs of distortion.","r":"Level the stoker in the boiler and repair/replace the distorted frame sections.","p":"Medium","t":"StokerLevelFrame","d":"check"},{"q":"Guillotine door & castings","f":"Guillotine doors not level; guillotine castings/refractory damaged; door height not displayed / encoder faulty.","r":"Repair guillotine doors and castings; replace the guillotine door level indicator/encoder.","p":"Medium","t":"GuillotineDoorCastings","d":"check"},{"q":"Ignition arch condition & seal","f":"Air leaks found on the ignition arch; ignition arch seal rope damaged.","r":"Replace ignition arch seal rope and close air leaks to prevent cold air cooling the ignition arch.","p":"Medium","t":"IgnitionArchCondition","d":"check"},{"q":"Draught pipework & furnace pressure control (Photohelic)","f":"Draught pipework to the ignition arch missing/damaged with no feedback to the Photohelic; no automatic control of ID and FD fans.","r":"Repair draught pipework; replace the Photohelic with a Yokogawa pressure controller for automatic furnace pressure control.","p":"High","t":"DraughtPipeworkFurnace","d":"check"},{"q":"Swinging chute installed & working","f":"No swinging chute installed; air leaks from the coal hopper.","r":"Install a swinging chute between the overhead fuel hopper and the stoker hopper. This also prevents air leaks at the coal hopper.","p":"Medium","t":"SwingingChuteInstalled","d":"check"},{"q":"Coal hopper & shut-off doors","f":"The stoker hoppers and shut-off doors need replacement; air leaks found on the coal hopper.","r":"Replace stoker hoppers and shut-off doors; seal air leaks.","p":"Medium","t":"CoalHopperShut","d":"check"},{"q":"Undergrate dampers & actuators","f":"Undergrate damper actuators not installed / not working.","r":"Install/repair undergrate damper actuators for correct air distribution along the grate.","p":"Medium","t":"UndergrateDampersActuators","d":"check"},{"q":"Stoker drive (motor, chain, V-belts, cover)","f":"Stoker motor misaligned, chain loose and slipping, V-belts loose with slippage, no V-belt cover.","r":"Align the stoker motor, tension the chain, replace and tension V-belts and install a V-belt cover.","p":"Medium","t":"StokerDrive","d":"check"},{"q":"FD fan control","f":"FD fan actuator missing / damper control poor.","r":"Install a VSD to control the FD fan speed instead of damper and actuator for better control of air flow.","p":"Medium","t":"FdFanControl","d":"check"},{"q":"ID fan control","f":"ID damper actuator not working.","r":"Install a VSD for ID fan speed control. VSDs give finer, more accurate control than actuator-driven dampers.","p":"Medium","t":"IdFanControl","d":"check"},{"q":"O2 probe & analyser","f":"No O2 probe/analyser installed; monitoring of efficient combustion is not possible.","r":"Install a Lamtec LT2 O2 analyser per furnace and reduce flue gas oxygen content by adjusting the fuel trim and automating combustion control.","p":"High","t":"O2ProbeAnalyser","d":"check"},{"q":"Temperature probes (ignition arch, rear roller, coal hopper)","f":"Ignition arch / rear roller / coal hopper temperature probes not installed or broken.","r":"Install/replace the ignition arch, rear roller and coal hopper temperature probes.","p":"Medium","t":"TemperatureProbes","d":"check"},{"q":"Spy holes & air leaks","f":"Spy holes and air leaks around the stoker allow cold air in, cooling the ignition arch.","r":"Close spy holes and air leaks around the stoker to prevent cold air cooling the ignition arch.","p":"Low","t":"SpyHolesAir","d":"check"},{"q":"Moisturising steam to coal","f":"No moisturising steam introduced into the coal in the stoker hopper.","r":"Introduce moisturising steam into the coal in the stoker hopper; this assists the fine fuel fraction to adhere and burn properly.","p":"Low","t":"MoisturisingSteamTo","d":"check"}]},{"section":"Boiler Equipment — Stoker (report 7)","items":[{"q":"Grit collector condition","f":"Grit collector blocked/dirty; internals worn; wedge plates not sealing on the grit trolley causing air ingress.","r":"Clean out the grit collector, replace the internals and re-align the wedge plates so they seal tightly onto the grit trolley.","p":"Medium","t":"GritCollectorCondition","d":"check"},{"q":"Grit collector DP gauges","f":"The grit arrestor pressure drop cannot be monitored as differential pressure gauges are not installed.","r":"Install differential pressure gauges on the grit collectors and boilers to indicate the level of blockage.","p":"Medium","t":"GritCollectorDp","d":"check"},{"q":"Grit / ash trolleys & chute doors","f":"Grit trolleys, ash chute trolleys and ash chute doors damaged/leaking.","r":"Repair and replace leaking/damaged ash chute doors, grit collector double flaps and trolleys.","p":"Medium","t":"GritAshTrolleys","d":"check"},{"q":"Sootblowers","f":"Sootblowers not working.","r":"Repair sootblowers and operate per the maintenance schedule.","p":"Medium","t":"Sootblowers","d":"check"},{"q":"Emission tests","f":"Emission test records not available.","r":"Emission tests to be completed.","p":"Low","t":"EmissionTests","d":"check"}]}],"burner":[{"section":"Fuel / HFO Handling — Burner (data entry + condition)","items":[{"q":"DATA: Required fuel temperature at burner (spec)","f":"(entry field, deg C)","r":"(no recommendation - data only)","p":"-","t":"RequiredFuelTemperature","d":"data"},{"q":"DATA: Required fuel pressure at burner (spec)","f":"(entry field, bar)","r":"(no recommendation - data only)","p":"-","t":"RequiredFuelPressure","d":"data"},{"q":"DATA: Fuel pump control type (dropdown: VSD / DOL / Ring main / Pressure regulator / Other)","f":"(entry field)","r":"(no recommendation - data only)","p":"-","t":"FuelPumpControl","d":"data"},{"q":"MEASURED: Actual fuel temperature at burner","f":"Actual fuel temperature measured at ___ deg C, outside the required specification, negatively affecting atomisation and combustion.","r":"Repair/replace fuel heaters and heat tracing and restore the fuel temperature to specification for proper atomisation.","p":"High","t":"ActualFuelTemperature","d":"measured"},{"q":"MEASURED: Actual fuel pressure at burner","f":"Actual fuel pressure measured at ___ bar, outside the required specification, negatively affecting combustion stability.","r":"Restore the fuel supply pressure to specification. Install/set a separate pressure regulator for the burner and keep the ring main at constant pressure.","p":"High","t":"ActualFuelPressure","d":"measured"},{"q":"Fuel pump condition","f":"Fuel pump worn/leaking and requires attention.","r":"Service or replace the fuel pump.","p":"High","t":"FuelPumpCondition","d":"check"},{"q":"Fuel pump VSD / motor control condition","f":"Fuel pump VSD/motor control faulty or not in use; pump running uncontrolled.","r":"Repair or replace the VSD/motor control for stable fuel supply pressure and efficient pump operation.","p":"Medium","t":"FuelPumpVsd","d":"check"}]},{"section":"Combustion — Burner (report 6.3 / 7.3)","items":[{"q":"Burner service records","f":"Records of the last burner service were not provided.","r":"Maintain records of burner services and work done. A bi-annual burner service is recommended to run burners at optimal efficiency.","p":"Medium","t":"BurnerServiceRecords","d":"check"},{"q":"Fuel/oil leaks at burner","f":"Leaking of HFO was observed at the burner / oil leaking into the cup on standby due to worn internal seals of the fuel block.","r":"Overhaul the burner fuel block with a full service kit and seal all oil leaks on burners and oil lines to prevent energy loss, safety hazards and contamination.","p":"High","t":"FuelOilLeaks","d":"check"},{"q":"Atomiser cup condition & cleaning routine","f":"Burner cup not properly cleaned as needed (every start of shift).","r":"Clean the atomiser cup at the start of every shift and include it in the operator duties.","p":"Medium","t":"AtomiserCupCondition","d":"check"},{"q":"Atomiser V-belt (tension, alignment, wear)","f":"Atomiser belt comes off at start-up: belt tension too high and motor/atomiser pulleys misaligned.","r":"Align motor and atomiser pulleys, set correct belt tension and keep a spare belt on site. Replace the belt if worn.","p":"Medium","t":"AtomiserVBelt","d":"check"},{"q":"Burner quarl / refractory","f":"Burner quarl/refractory cracked or worn.","r":"Replace burner quarl/refractory at the next service (refractory bricks and cement available from John Thompson).","p":"High","t":"BurnerQuarlRefractory","d":"check"},{"q":"Burner vanes, swirler & ducting","f":"Burner head air cone worn / vanes and ducting fouled.","r":"Clean and inspect burner vanes, swirler cup and ducting; replace worn components.","p":"Medium","t":"BurnerVanesSwirler","d":"check"},{"q":"Primary air ducting & air leaks","f":"Primary air ducting leaking (temporarily sealed with tape); air leaks on ducting and smoke doors.","r":"Repair all air leaks on ducting and smokebox doors to maintain proper combustion air control; replace ducting where required.","p":"Medium","t":"PrimaryAirDucting","d":"check"},{"q":"Air damper linkages & actuators","f":"Primary/secondary air damper linkages loose or movement restricted.","r":"Tighten and free up damper linkages so movement is clear and unrestricted; check actuator calibration.","p":"Medium","t":"AirDamperLinkages","d":"check"},{"q":"Ignition assembly (transformer, probe, cable, pilot)","f":"Ignition assembly damaged; gas pipe nozzle broken and temporarily repaired.","r":"Replace the damaged ignition components; reroute cabling to minimise damage and wear.","p":"High","t":"IgnitionAssembly","d":"check"},{"q":"Flame scanner & controller","f":"Flame scanner failing / not detecting flame at low fire due to fuel quality, causing lockouts.","r":"Clean/replace the flame scanner, tidy and reroute cabling, and address fuel quality to ensure reliable flame detection at low fire.","p":"High","t":"FlameScannerController","d":"check"},{"q":"Heat tracing on oil lines","f":"Heat tracing on burner oil lines damaged and not working.","r":"Replace the heat tracing on the burner and ring main oil lines and insulate the oil lines properly.","p":"Medium","t":"HeatTracingOn","d":"check"},{"q":"Minimum air pressure switch","f":"Minimum air pressure switch faulty / airline blocked.","r":"Replace the minimum air pressure switch and clean/reroute the airline. Burner ignition must be prevented when air pressure is not present.","p":"High","t":"MinimumAirPressure","d":"check"},{"q":"Primary air differential pressure switch","f":"Primary air differential switch faulty / airlines blocked or damaged.","r":"Replace the differential air pressure switch; the burner must lock out if the primary air chamber differential is not balanced at ignition.","p":"High","t":"PrimaryAirDifferential","d":"check"},{"q":"Burner door hinge limit switch","f":"Door hinge limit switch damaged; burner does not lock out when the door is opened.","r":"Replace the door open limit switch so the burner locks out when the door is opened.","p":"High","t":"BurnerDoorHinge","d":"check"},{"q":"Ring main pressure stability","f":"The ring main does not maintain constant pressure, negatively impacting combustion stability and burner efficiency.","r":"Resolve oil pressure fluctuations in the ring main. Install a separate pressure regulator for the burner and keep the ring main at a constant pressure so operators need not adjust supply pressure when switching between boilers.","p":"High","t":"RingMainPressure","d":"check"},{"q":"O2 analyser & reference air pump","f":"No O2 analyser installed / reference air pump and filter defective, affecting accuracy of oxygen readings.","r":"Install/replace the O2 analyser with a Lamtec LT2 KS1D-HT probe and control panel for improved combustion monitoring and control.","p":"High","t":"O2AnalyserReference","d":"check"},{"q":"Combustion test (O2 across load range)","f":"Flue gas oxygen content outside the optimal range.","r":"Reduce the flue gas oxygen content to between 3% and 6% by adjusting the fuel/air ratio. Yearly combustion set-ups should be done for optimal combustion efficiency.","p":"Medium","t":"CombustionTest","d":"check"},{"q":"Fuel flow meter","f":"No fuel flow meter installed / HFO flow meter not working; fuel consumption not recorded.","r":"Install/replace the fuel flow meter to monitor and record fuel consumption.","p":"Medium","t":"FuelFlowMeter","d":"check"}]}],"biomass":[{"section":"Fuel Handling & Feeding — Biomass","items":[{"q":"Fuel storage / bunker condition & housekeeping","f":"Fuel storage area untidy and fuel exposed to rain, increasing the moisture content of the fuel.","r":"Store biomass fuel under cover and keep the storage area clean to control moisture content and fire risk.","p":"Medium","t":"FuelStorageBunkerCon","d":"check"},{"q":"Fuel moisture & quality as fired","f":"Fuel moisture content is high and the fuel contains contaminants (sand, stones, metal), reducing combustion efficiency and damaging the grate.","r":"Control fuel moisture (typically below 30-35% for grate firing) and screen out contaminants. Record fuel moisture daily.","p":"High","t":"FuelMoistureQualityA","d":"check"},{"q":"Fuel feeding system (screw / ram / conveyor)","f":"Fuel feeding system worn, blocking or feeding irregularly.","r":"Repair the fuel feeding system and set up feed-rate control linked to steam demand.","p":"High","t":"FuelFeedingSystem","d":"check"},{"q":"Metering bin / fuel level control","f":"Fuel level control in the metering bin is not working; fuel supply to the furnace is irregular.","r":"Repair the metering bin level sensors and feed control.","p":"Medium","t":"MeteringBinFuelLevel","d":"check"},{"q":"Burn-back / fire protection on fuel feed","f":"Burn-back protection not working or not installed, posing a fire risk in the fuel feed system.","r":"Install or repair burn-back protection (rotary valve or double flap, feed chute temperature sensor and water quench) and test it regularly.","p":"High","t":"BurnBackFireProtecti","d":"check"}]},{"section":"Combustion — Biomass","items":[{"q":"Grate type & condition (moving / reciprocating / fixed)","f":"Grate bars worn, warped or missing, causing an uneven fuel bed and poor air distribution.","r":"Replace worn or damaged grate bars and restore correct grate movement and speed settings.","p":"High","t":"GrateTypeCondition","d":"check"},{"q":"Clinker / slag formation on grate","f":"Clinker formation on the grate is restricting combustion air.","r":"Remove clinker; check the fuel ash content and furnace temperatures and adjust primary air and grate speed to prevent clinker forming.","p":"Medium","t":"ClinkerSlagFormation","d":"check"},{"q":"Primary & secondary air distribution / dampers","f":"Primary and secondary air dampers are not working or not controlled, resulting in incomplete combustion.","r":"Repair the dampers and actuators and set up primary/secondary air distribution for complete combustion.","p":"High","t":"PrimarySecondaryAirD","d":"check"},{"q":"Furnace refractory & ignition arch","f":"Furnace refractory is cracked or damaged.","r":"Repair the damaged refractory.","p":"High","t":"FurnaceRefractoryIgn","d":"check"},{"q":"Furnace pressure control","f":"Furnace pressure is not controlled, with a risk of smoke and flame blow-back.","r":"Repair the furnace pressure transmitter and ID fan control to maintain a slight negative furnace pressure.","p":"High","t":"FurnacePressureContr","d":"check"},{"q":"FD / ID fans & VSDs","f":"FD/ID fans are controlled by dampers only or the VSDs are faulty.","r":"Install or repair VSDs on the FD and ID fans for accurate combustion air control.","p":"Medium","t":"FdIdFansVsds","d":"check"},{"q":"O2 analyser & combustion setting","f":"No O2 analyser installed; combustion efficiency cannot be monitored.","r":"Install an O2 analyser and set combustion for the fuel fired (typically 6-8% O2 for biomass).","p":"High","t":"O2AnalyserCombustion","d":"check"},{"q":"Unburnt fuel in ash","f":"High unburnt fuel in the ash, indicating incomplete combustion.","r":"Adjust grate speed, fuel bed depth and air distribution to reduce unburnt fuel in the ash.","p":"Medium","t":"UnburntFuelInAsh","d":"check"},{"q":"Furnace temperature probes","f":"Furnace temperature probes not installed or faulty.","r":"Install or replace the furnace temperature probes.","p":"Medium","t":"FurnaceTemperaturePr","d":"check"}]},{"section":"Ash Handling & Emissions — Biomass","items":[{"q":"Ash removal system (screw / conveyor / wet ash)","f":"Ash removal system blocked, worn or leaking.","r":"Repair the ash removal system and schedule regular cleaning.","p":"Medium","t":"AshRemovalSystem","d":"check"},{"q":"Grit arrestor / multi-cyclone","f":"Grit arrestor / multi-cyclone blocked or worn and the differential pressure is not monitored.","r":"Clean the grit arrestor / multi-cyclone, replace worn internals and install differential pressure gauges.","p":"Medium","t":"GritArrestorMultiCyc","d":"check"},{"q":"Spark arrestor / fire risk in flue path","f":"No spark arrestor; sparks are carried over into the flue path.","r":"Install a spark arrestor upstream of any filter equipment to prevent fires.","p":"High","t":"SparkArrestorFireRis","d":"check"},{"q":"Visible stack emissions","f":"Visible smoke at the stack, indicating incomplete combustion.","r":"Adjust combustion settings and complete emission testing.","p":"Medium","t":"VisibleStackEmission","d":"check"},{"q":"Sootblowers / heating surface cleaning","f":"Heating surfaces fouled and sootblowers not working.","r":"Repair the sootblowers and clean the heating surfaces regularly.","p":"Medium","t":"SootblowersHeatingSu","d":"check"}]}],"site":[{"section":"Steam System Profiling (report 4)","items":[{"q":"Steam distribution & operating pressures","f":"Operating pressure and distribution issues noted (describe).","r":"Review steam system operating pressures and distribution; install shut-off valves on the main steam manifold where missing.","p":"Medium","t":"SteamDistributionOperating","d":"check"}]},{"section":"Steam Traps (report 5.1)","items":[{"q":"Steam traps installed & trap set composition","f":"The steam trap sets consist of only an isolation valve before the steam trap.","r":"Each trap set should consist of: two isolation valves (one on either side), strainer before the trap, steam trap, sight glass and check valve.","p":"Medium","t":"SteamTrapsInstalled","d":"check"},{"q":"Traps passing steam?","f":"Most steam traps are functional but some are passing steam, seen from the feedwater storage tank overfilling and steam flow from the tank vent.","r":"Carry out an in-house audit to determine whether the correct traps are selected and sized; replace damaged traps; set up and maintain a steam trap database; test traps at least once a year and record all maintenance.","p":"High","t":"TrapsPassingSteam","d":"check"},{"q":"Condensate return pipework lagged?","f":"Condensate return pipework unlagged on some return lines.","r":"All condensate return pipework should be lagged and clad and returned to the feedwater storage tank. Install bypass valves to allow contaminated condensate to be dumped.","p":"Medium","t":"CondensateReturnPipework","d":"check"}]},{"section":"Water Treatment Plant (report 5.2 site)","items":[{"q":"Water softener working?","f":"Make-up water is not being softened as the unit is not working.","r":"Repair, replace or have your local supplier investigate the water softener units and chemical dosing. Customer to supply service report.","p":"High","t":"WaterSoftenerWorking","d":"check"},{"q":"Chemical dosing system","f":"Chemical dosing pumps installed but chemicals are not being introduced into the feedwater storage tank.","r":"Restore chemical dosing. Regular inspection of the chemical drums is required and must be noted in the operator's logbook to prevent the boiler being operated without the required chemicals.","p":"High","t":"ChemicalDosingSystem","d":"check"},{"q":"Water treatment specialist visits & reports","f":"Water treatment service reports need to be supplied for review.","r":"A local water treatment specialist must make regular visits to ensure operators and laboratory technicians maintain correct chemical dosing and boiler blowdown.","p":"Medium","t":"WaterTreatmentSpecialist","d":"check"},{"q":"TDS / pH recording practice","f":"TDS and pH are not measured and recorded daily.","r":"TDS and pH levels must be recorded for each shift in the daily logbook.","p":"Medium","t":"TdsPhRecording","d":"check"},{"q":"Chemical spillage / housekeeping","f":"Chemical spillage present on feedwater storage tank and pipework.","r":"Clean chemical spillage and repair the source; protect the tank and pipework from corrosion.","p":"Low","t":"ChemicalSpillageHousekeeping","d":"check"},{"q":"Feedwater tank & hotwell condition","f":"Hotwell tank and pipework leaking and heavily rusted / feedwater temperature too high due to condensate return.","r":"Repair/replace the hotwell tank and pipework; manage feedwater temperature to protect the feedwater pumps.","p":"Medium","t":"FeedwaterTankHotwell","d":"check"}]},{"section":"Insulation (report 5.3)","items":[{"q":"Steam pipework lagging (boiler house)","f":"Steam pipework inside the boiler house is damaged or missing lagging.","r":"Repair all damaged lagging and cladding; lag all unlagged pipework inside the boiler house and the steam pipework to each process.","p":"Medium","t":"SteamPipeworkLagging","d":"check"},{"q":"Valves & flanges lagged?","f":"Valves and flanges inside the boiler house are unlagged.","r":"Lag all valves and flanges inside the boiler house and between the boiler house and process plants.","p":"Medium","t":"ValvesFlangesLagged","d":"check"},{"q":"Feedwater tank & lines lagged?","f":"Feedwater storage tank lagging shows spillage and wear; no cladding on feedwater lines.","r":"Lag the feedwater tank and feedwater lines to the boiler.","p":"Low","t":"FeedwaterTankLines","d":"check"},{"q":"Condensate return lines lagged?","f":"Condensate return pipework is unlagged on some return lines.","r":"Lag the condensate return pipework.","p":"Low","t":"CondensateReturnLines","d":"check"}]},{"section":"Steam Leaks (report 5.4 site)","items":[{"q":"Steam/water leaks in boiler house & distribution","f":"The following steam leaks were noted: (list locations).","r":"Replace and repair leaking valves and components as soon as steam and water leaks occur; repair pipework with steam leaks.","p":"High","t":"SteamWaterLeaks","d":"check"}]},{"section":"Condensate Recovery (report 6.2)","items":[{"q":"Condensate return percentage / system state","f":"There is 0% condensate return - a significant loss due to wasted water and heat not returned to the feedwater storage tank.","r":"Automate and repair the condensate return system; check all steam traps to ensure they are not passing steam; install a meter for monitoring condensate return/loss to calculate the cost of steam production.","p":"High","t":"CondensateReturnPercentage","d":"check"}]},{"section":"Operator Duties (report 6.4 / 7.4)","items":[{"q":"Logbook: 4-hourly recordings done?","f":"Operators do not record the required 4-hourly readings.","r":"Record every 4 hours: boiler water TDS and pH; blowdown; feedwater TDS, pH, hardness, pressure and tank level; softener online; bags of salt added; brine tank level; stack smoke appearance; flue gas exit temperature.","p":"Medium","t":"Logbook4Hourly","d":"check"},{"q":"Shift checks (blowdowns, alarms)","f":"Shift blowdown checks of gauge glass and level controls not performed.","r":"Blow down every shift to check the boiler trips and locks out at extra low water level; ensure operators measure and record all required readings.","p":"Medium","t":"ShiftChecks","d":"check"},{"q":"Operator training","f":"Operators not adequately trained on the equipment.","r":"Operators must be trained to safely operate the equipment.","p":"Medium","t":"OperatorTraining","d":"check"}]}]};
const BP = {"_note":"Standard report wording. The cover page, disclaimer and confidentiality text come from JT_Report_Template.docx itself. After editing this file, rebuild the phone app with tools/build_app.py so the app uses the same wording.","objective":"John Thompson was assigned to perform a boiler house audit, carry out the necessary inspections, and provide recommendations to address any identified deficiencies.","prepared_by_name":"Service Engineer","prepared_by_title":"John Thompson","exec_intro":"John Thompson was requested to perform a boiler house audit at {customer} on {date}. The audit consisted of a visual inspection of the boiler plant, testing of safety devices, testing of boiler controls and a general inspection of the boiler house and steam reticulation system.","exec_recommend_lead":"The following actions are recommended to improve compliance of the boiler house with statutory regulations and to improve the operation and thermal efficiency of the boiler plant:","exec_none":"No significant deficiencies were noted at the time of the audit.","scope_default":"A boiler house audit was performed as detailed in the sections below.","no_issues":"No issues noted at time of inspection.","work_done_none":"No additional work was performed during the audit.","efficiency_text":"Generally, the instrumentation required to complete an efficiency test is as follows: flue gas oxygen content, flue gas exit temperature, ambient air temperature and combustion (CO) readings. The table below indicates the flue gas oxygen content that should be achieved for optimal combustion efficiency. These values are provided as an indication to the customer of what should be achievable.","efficiency_targets":{"stoker":["Coal-fired chain grate stoker","8 % O2"],"burner":["Oil / gas-fired burner","3 - 6 % O2"],"biomass":["Biomass-fired","6 - 8 % O2"]}};

/* =====================================================================
   STORAGE (IndexedDB) — same database as earlier versions, so existing
   reports and the edited question library carry over.
   ===================================================================== */
let db;
function idb(){ return new Promise((res,rej)=>{
  const r = indexedDB.open("jt_audit",2);
  r.onupgradeneeded = e=>{ const d=e.target.result;
    if(!d.objectStoreNames.contains("jobs")) d.createObjectStore("jobs",{keyPath:"id"});
    if(!d.objectStoreNames.contains("photos")){ const p=d.createObjectStore("photos",{keyPath:"id"}); p.createIndex("job","jobId"); }
    if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv",{keyPath:"k"});
  };
  r.onsuccess=e=>{db=e.target.result;res();}; r.onerror=e=>rej(e.target.error||e);
});}
const tx=(s,m)=>db.transaction(s,m).objectStore(s);
const put=(s,v)=>new Promise((res,rej)=>{const r=tx(s,"readwrite").put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
const del=(s,k)=>new Promise((res,rej)=>{const r=tx(s,"readwrite").delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
const get=(s,k)=>new Promise((res,rej)=>{const r=tx(s,"readonly").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const all=(s)=>new Promise((res,rej)=>{const r=tx(s,"readonly").getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const photosOf=(jobId)=>new Promise((res,rej)=>{const r=tx("photos","readonly").index("job").getAll(jobId);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const clean=s=>(s||"").replace(/[^A-Za-z0-9]+/g,"").slice(0,20)||"X";
const tagOf=s=>(s||"").replace(/\(.*?\)/g,"").split(/[^A-Za-z0-9]+/).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1).toLowerCase()).join("").slice(0,20)||"Item";
function fmtDate(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||""); return m?`${m[3]}/${m[2]}/${m[1]}`:(iso||""); }

/* =====================================================================
   QUESTION LIBRARY + SAVED LISTS + SETTINGS
   ===================================================================== */
let LIB=null, LISTS=null, SETTINGS=null;
const PARTS=[["shared","Shared (all boilers)"],["stoker","Coal / stoker"],["burner","Oil / gas burner"],["biomass","Biomass"],["site","Site-wide"]];
function seedPart(part){ return (QDB[part]||[]).map((s,si)=>({id:`b_${part}_${si}`,section:s.section,
  items:s.items.map((it,qi)=>Object.assign({},it,{id:`b_${part}_${si}_${qi}`}))})); }
function seedLib(){ const L={}; PARTS.forEach(([p])=>L[p]=seedPart(p)); L._v=5; return L; }
async function loadLib(){
  const v=await kvGet("lib",null);
  if(!v){ LIB=seedLib(); await saveLib(); return; }
  LIB=v; let changed=false;
  PARTS.forEach(([p])=>{ if(!LIB[p]){ LIB[p]=seedPart(p); changed=true; } });
  if(!LIB._v||LIB._v<5){ // fuel type is now on the Fuel form, not a burner question
    LIB.burner.forEach(s=>{ const n=s.items.length; s.items=s.items.filter(it=>!/^DATA: Fuel type used/.test(it.q)); if(s.items.length!==n) changed=true; });
    LIB._v=5; changed=true; }
  if(changed) await saveLib();
}
function saveLib(){ return kvPut("lib",LIB); }
const DEFAULT_LISTS={
  fuel:{coal:["Grade A Peas","Grade B Peas","Grade C Smalls"],
        oil:["HFO","RFO","LFO","Diesel","Paraffin","LPG","Natural gas"],
        biomass:["Wood chips","Bagasse","Sawdust","Macadamia nut shells","Rice husk","Wood pellets"]},
  extras:{"Economiser":["Economiser tubes / fins condition","Water inlet / outlet temperature","Flue gas inlet / outlet temperature","Cleaning / soot blowing","Bypass damper operation","Leaks"],
          "Bag filter":["Filter bags condition","Differential pressure across bags","Pulse-jet cleaning / compressed air supply","Hopper, rotary valve & dust discharge","High temperature protection / bypass","Visible emissions at stack"]}};
async function loadLists(){ LISTS=await kvGet("lists",null);
  if(!LISTS){ LISTS=JSON.parse(JSON.stringify(DEFAULT_LISTS)); await kvPut("lists",LISTS); }
  LISTS.fuel=LISTS.fuel||{}; ["coal","oil","biomass"].forEach(c=>LISTS.fuel[c]=LISTS.fuel[c]||[]); LISTS.extras=LISTS.extras||{}; }
const saveLists=()=>kvPut("lists",LISTS);
function rememberFuel(cat,name){ name=(name||"").trim(); if(!name)return; const l=LISTS.fuel[cat];
  if(!l.some(x=>x.toLowerCase()===name.toLowerCase())){ l.push(name); saveLists(); } }
function rememberExtra(name,title){ name=(name||"").trim(); if(!name)return; const key=Object.keys(LISTS.extras).find(k=>k.toLowerCase()===name.toLowerCase())||name;
  LISTS.extras[key]=LISTS.extras[key]||[]; if(title&&!LISTS.extras[key].some(t=>t.toLowerCase()===title.toLowerCase())) LISTS.extras[key].push(title); saveLists(); }

/* =====================================================================
   JOB MODEL
   ===================================================================== */
let job=null;
function saveJob(){ job.updated=Date.now(); return put("jobs",job); }
function fixJob(j){
  j.answers=j.answers||{}; j.boilers=j.boilers||[];
  j.scope=j.scope||{requested:[""],done:[""]};
  j.scope.requested=j.scope.requested&&j.scope.requested.length?j.scope.requested:[""];
  j.scope.done=j.scope.done&&j.scope.done.length?j.scope.done:[""];
  const c=j.customer=j.customer||{};
  if(!Array.isArray(c.dist)){ c.dist=String(c.emails||"").split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean).map(e=>({name:e,email:e})); }
  if(!j.prepared) j.prepared={name:(SETTINGS&&SETTINGS.name)||"",title:(SETTINGS&&SETTINGS.title)||""};
  j.boilers.forEach(b=>{ if(!b.fuel||typeof b.fuel!=="object") b.fuel={type:typeof b.fuel==="string"?b.fuel:""}; b.extras=b.extras||[]; if(!FIRING[b.firing]) b.firing="burner"; });
  return j;
}
const QS=()=>job.qs||LIB;
const boilerOf=id=>job.boilers.find(x=>x.id===id);
function setFor(scope){ const q=QS(); if(scope==="site") return q.site||[]; const b=boilerOf(scope);
  return (q.shared||[]).concat(q[firingOf(b).part]||[]); }
const qKey=(scope,qid)=>scope+"|"+qid;
function ans(scope,qid){ const k=qKey(scope,qid); if(!job.answers[k]) job.answers[k]={s:"",f:"",r:"",p:"",v:"",e:""}; return job.answers[k]; }
const answered=(it,a)=>!!(a&&(a.s||((it.d==="data")&&a.v)));
function counts(scope){ let t=0,d=0;
  setFor(scope).forEach(sec=>sec.items.forEach(it=>{ t++; if(answered(it,job.answers[qKey(scope,it.id)])) d++; }));
  if(scope!=="site"){ const b=boilerOf(scope); b.extras.forEach(x=>x.items.forEach(i=>{ t++; if(i.s) d++; })); }
  return [d,t]; }

/* =====================================================================
   NAVIGATION
   ===================================================================== */
const stack=[]; let objURLs=[]; let PT={}, ptN=0;
function go(fn,...args){ stack.push([fn,args]); fn(...args); }
function back(){ stack.pop(); if(stack.length){ const [fn,args]=stack[stack.length-1]; fn(...args);} else home(); }
$("backBtn").onclick=back;
function screen(title,html,fnavHtml,keepScroll){ const y=window.scrollY;
  objURLs.forEach(u=>URL.revokeObjectURL(u)); objURLs=[];
  $("hTitle").textContent=title; $("view").innerHTML=html;
  $("backBtn").style.display=stack.length>1?"":"none";
  const f=$("fnav"); if(fnavHtml){f.innerHTML=fnavHtml;f.style.display="flex";} else {f.style.display="none";}
  if(keepScroll){ window.scrollTo(0,y); requestAnimationFrame(()=>window.scrollTo(0,y)); } else window.scrollTo(0,0); }
function rerender(){ const [fn,args]=stack[stack.length-1]; fn(...args,true); }

  const jobs=(await all("jobs")).sort((a,b)=>b.updated-a.updated);
  let h="";
  if(!SETTINGS.name) h+=`<div class="warnbox"><b>First time?</b> Enter your name and job title under <b>My details</b>. They are printed on the report cover as "Prepared by".</div>`;
  h+='<button class="btn big wide" onclick="newJob()">+ New Report</button>';
  h+=jobs.map(j=>`<div class="list-item tap" onclick="openJob('${j.id}')">
    <div class="grow"><div class="title">${esc(j.customer&&j.customer.name)||"(no customer name)"}</div>
    <div class="sub">${esc(j.customer&&j.customer.reportNo)||"no report no."} &middot; ${(j.boilers||[]).length} boiler(s) &middot; ${new Date(j.updated).toLocaleDateString()}${j.imported?" &middot; imported":""}</div></div>
    <span class="badge">open</span></div>`).join("");
  if(!jobs.length) h+='<p class="hint center">No reports yet. Tap + New Report to start.</p>';
  h+=`<div class="card"><h2>More</h2>
    <button class="btn sec" onclick="go(settingsView)">&#128100; My details</button>
    <button class="btn sec" onclick="importPick()">&#128229; Import job (ZIP)</button>
    <button class="btn sec" onclick="go(libHome)">&#9998; Questions &amp; lists</button>
    <p class="hint">Version ${esc(APP_VER)}</p></div>`;
  screen("JT Boiler Audit",h);
}

/* =====================================================================
   PHOTOS
   ===================================================================== */
function ptKey(scope,tag,label){ const k="pt"+(++ptN); PT[k]={scope,tag,label}; return k; }
function photoBlock(k){ return `<div class="photos" id="ps_${k}"></div>
  <div class="row"><button class="btn sec small" onclick="snap('${k}','camera')">&#128247; Take photo</button>
  <button class="btn sec small" onclick="snap('${k}','gallery')">&#128444; Upload</button></div>`; }
let pendingShot=null;
const fileCam=document.createElement("input"); fileCam.type="file"; fileCam.accept="image/*"; fileCam.capture="environment";
const fileGal=document.createElement("input"); fileGal.type="file"; fileGal.accept="image/*"; fileGal.multiple=true;
fileCam.onchange=e=>gotFiles(e.target.files); fileGal.onchange=e=>gotFiles(e.target.files);
function snap(k,mode){ pendingShot=Object.assign({k},PT[k]); (mode==="camera"?fileCam:fileGal).click(); }
async function gotFiles(files){ if(!pendingShot||!files||!files.length)return;
  const {scope,tag,label,k}=pendingShot;
  let seq=(await photosOf(job.id)).filter(p=>p.scope===scope&&p.tag===tag).length;
  for(const f of files){ seq++;
    const bNo = scope==="site" ? "SITE" : "B"+clean((boilerOf(scope)||{}).no||"?");
    const fname=`${yymmdd()}_${clean(job.customer.name)}_${bNo}_${clean(label||tag)}_${String(seq).padStart(2,"0")}.jpg`;
    await put("photos",{id:uid(),jobId:job.id,scope,tag,label:label||"",include:true,caption:"",filename:fname,blob:f,created:Date.now()});
    try{ const a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=fname; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }catch(e){}
  }
  fileCam.value=""; fileGal.value=""; pendingShot=null;
  renderPhotos(k); }
async function renderPhotos(k){ const el=$("ps_"+k); const t=PT[k]; if(!el||!t)return;
  const ph=(await photosOf(job.id)).filter(p=>p.scope===t.scope&&p.tag===t.tag).sort((a,b)=>a.created-b.created);
  el.innerHTML=ph.map(p=>{ const u=URL.createObjectURL(p.blob); objURLs.push(u);
    return `<div class="ph"><img src="${u}">
    <input class="cap" placeholder="caption" value="${esc(p.caption)}" onchange="capChange('${p.id}',this.value)">
    <div class="inc"><input type="checkbox" ${p.include?"checked":""} onchange="incChange('${p.id}',this.checked)"> in report</div>
    <button class="del" onclick="delPhoto('${p.id}','${k}')">remove</button></div>`; }).join(""); }
async function capChange(id,v){ const p=await get("photos",id); p.caption=v; await put("photos",p); }

function quest(scope,si,_k){ const set=setFor(scope); if(si>=set.length){ back(); return; }
  PT={}; const sec=set[si];
  const title=scope==="site"?"Site-Wide":"Boiler "+boilerOf(scope).no;

  screen(title,h,
   `<button class="btn sec" onclick="prevSec('${scope}',${si})">&#8592; Prev</button>
    <button class="btn" onclick="nextSec('${scope}',${si})">${si+1<set.length?"Next section &#8594;":"Done"}</button>`,_k);
  keys.forEach(renderPhotos); }
function prevSec(scope,si){ if(si>0){ stack.pop(); go(quest,scope,si-1);} else back(); }
async function nextSec(scope,si){ await saveJob(); stack.pop(); go(quest,scope,si+1); }
const PRIOS=[["High","H"],["Medium","M"],["Low","L"],["N/A","N"]];
function commentPanel(a,it,call){ // call = JS arg list string for handlers
  let h='<div class="panel">';
  if(it&&it.f) h+=`<div class="suggest"><b>Suggested finding:</b> ${esc(it.f)}<br><button class="use" onclick="useF(${call})">&#8595; Use finding</button></div>`;
  h+=`<label>${a.s==="OK"?"Comment / finding":"Finding"}</label><textarea onchange="setF(${call},'f',this.value)">${esc(a.f)}</textarea>`;
  if(it&&it.r) h+=`<div class="suggest"><b>Suggested recommendation:</b> ${esc(it.r)}<br><button class="use" onclick="useR(${call})">&#8595; Use recommendation</button></div>`;
  h+=`<label>Recommendation</label><textarea onchange="setF(${call},'r',this.value)">${esc(a.r)}</textarea>
   <label>Priority list</label><div class="prio">${PRIOS.map(([p,c])=>`<button class="${a.p===p?"on-"+c:""}" onclick="setP(${call},'${p}')">${p}</button>`).join("")}</div>
   <p class="hint">N/A = not added to the priority list at the end of the report.</p></div>`;
  return h; }
function statusSeg(a,call){ return `<div class="seg">${["OK","Defect","N/A","Skip"].map(s=>{
  const on=a.s===s?("on-"+({OK:"ok",Defect:"def","N/A":"na",Skip:"skip"}[s])):"";
  return `<button class="${on}" onclick="setS(${call},'${s}')">${s}</button>`;}).join("")}</div>`; }
function qCard(scope,si,qi,it,k){ const a=ans(scope,it.id); const call=`'q','${scope}','${it.id}'`;
  const qtext=it.q.replace(/^(DATA|MEASURED): /,"");
  let body="";
  if(it.opts){ const other=!!a.eo;
    body+=`<label>Equipment type</label><select onchange="pickOpt('${scope}','${it.id}',this.value)">
     <option value="" ${!a.e&&!other?"selected":""}>-- select --</option>
     ${it.opts.map(o=>`<option ${!other&&a.e===o?"selected":""}>${esc(o)}</option>`).join("")}
     <option value="__other__" ${other?"selected":""}>Other / add new...</option></select>
     ${other?`<input type="text" placeholder="type equipment name" value="${esc(a.e)}" onchange="setF(${call},'e',this.value)">`:""}`; }
  if(it.d==="data"){ body+=`<label>Value</label><input type="text" value="${esc(a.v)}" onchange="setF(${call},'v',this.value,true)">`; }
  else{
    if(it.d==="measured") body+=`<label>Measured value</label><input type="text" value="${esc(a.v)}" onchange="setF(${call},'v',this.value)">`;
    body+=statusSeg(a,call);
    const open=a.s==="Defect"||(a.s==="OK"&&(a.c||a.f||a.r||(a.p&&a.p!=="N/A")));
    if(open) body+=commentPanel(a,it,call);
    else if(a.s==="OK") body+=`<button class="addc" onclick="openC(${call})">&#128172; Add comment / recommendation</button>`;
  }
  body+=photoBlock(k);
  return `<div class="card"><div class="qnum">Q${qi+1} ${mark(answered(it,a))}</div><h3 class="q">${esc(qtext)}</h3>${body}</div>`; }

/* shared answer handlers. kind 'q' = library question (scope,qid); kind 'x' = additional equipment item (bid, "xid:iid") */
function target(kind,scope,id){
  if(kind==="q") return {a:ans(scope,id), it:findItem(scope,id)};
  const [xid,iid]=id.split(":"); const x=boilerOf(scope).extras.find(e=>e.id===xid); return {a:x.items.find(i=>i.id===iid), it:null}; }
function findItem(scope,qid){ for(const s of setFor(scope)) for(const it of s.items) if(it.id===qid) return it; return null; }
async function setS(kind,scope,id,s){ const {a,it}=target(kind,scope,id); a.s=(a.s===s?"":s);
  if(a.s==="Defect"&&(!a.p||a.pAuto)){ a.p=(it&&["High","Medium","Low"].includes(it.p))?it.p:"Medium"; a.pAuto=true; }
  if(a.s==="OK"&&(!a.p||a.pAuto)){ a.p="N/A"; a.pAuto=true; }
  await saveJob(); rerender(); }
async function setF(kind,scope,id,field,val,redraw){ const {a}=target(kind,scope,id); a[field]=val; await saveJob(); if(redraw) rerender(); }
async function setP(kind,scope,id,p){ const {a}=target(kind,scope,id); a.p=p; a.pAuto=false; await saveJob(); rerender(); }
async function openC(kind,scope,id){ const {a}=target(kind,scope,id); a.c=true; await saveJob(); rerender(); }
async function useF(kind,scope,id){ const {a,it}=target(kind,scope,id); a.f=(a.f?a.f+" ":"")+it.f; await saveJob(); rerender(); }
async function useR(kind,scope,id){ const {a,it}=target(kind,scope,id); a.r=(a.r?a.r+" ":"")+it.r; await saveJob(); rerender(); }
async function pickOpt(scope,qid,v){ const a=ans(scope,qid); if(v==="__other__"){ a.eo=true; a.e=""; } else { a.eo=false; a.e=v; } await saveJob(); rerender(); }

   <div class="genbox"><h2 style="margin-top:0;color:var(--jt)">&#128196; Word report</h2>
     <p class="hint">Builds the finished John Thompson report on this phone (${job.boilers.length} boiler(s), ${inc} photo(s)). It is saved to Downloads and you can share it straight to email or WhatsApp.</p>

     <button class="btn big wide" id="genBtn" onclick="doGenerate()">Generate Word Report</button>
     <div class="status" id="genStatus"></div>
     <div id="genAfter" style="display:none"><button class="btn ok wide" onclick="shareReport()">&#128228; Share report</button>
       <button class="btn sec wide" onclick="download(lastReport.blob,lastReport.name)">Download again</button></div></div>
   <div class="card"><h2>&#128230; Export ZIP (for the laptop)</h2>
     <p class="hint">All answers + included photos in one ZIP, for the laptop generator or to move this job to another phone.</p>
     <button class="btn sec wide" onclick="doExport()">Export ZIP</button><div class="status" id="expStatus"></div></div>`,null,_k);
  if(lastReport&&lastReport.jobId===job.id){ $("genAfter").style.display=""; $("genStatus").textContent="Ready: "+lastReport.name; } }
function reportFileName(){ const c=job.customer; return [c.reportNo?clean(c.reportNo):yymmdd(), clean(c.name)||"Customer", "Boiler_House_Audit_Report"].join("_")+".docx"; }
async function doGenerate(){ const btn=$("genBtn"), st=$("genStatus"); btn.disabled=true; $("genAfter").style.display="none";

/* =====================================================================
   REPORT MODEL (shared logic with generator/generate_report.py)
   ===================================================================== */
const cleanSec=s=>String(s||"").replace(/\s*\((?:report|data)[^)]*\)\s*$/i,"").trim();
const qText=it=>String(it.q||"").replace(/^(DATA|MEASURED): /,"");
const baseName=q=>q.replace(/\s*(&\s*)?condition(\s*&\s*test)?\s*$/i,"").trim();
function findingOf(it,a){ let t=a.s==="Defect"?(a.f||(it&&it.f)||""):(a.s==="OK"?(a.f||""):"");
  if(a.v) t=t.replace(/_{3,}/g,a.v); return t.trim(); }
function recOf(it,a){ return (a.s==="Defect"?(a.r||(it&&it.r)||""):(a.s==="OK"?(a.r||""):"")).trim(); }
const PRIO=["High","Medium","Low"];
function reportModel(J){
  const qs=J.qs||LIB;
  const setOf=b=>(qs.shared||[]).concat(qs[(FIRING[b.firing]||FIRING.burner).part]||[]);
  const bLabel=b=>"Boiler "+(b.no||"");
  const order=[], secs={};               // section name -> [{boiler,data,find,recs}]
  const prio={High:[],Medium:[],Low:[]};  // [{group, text, section}]
  const addPrio=(p,group,text,section)=>{ if(PRIO.includes(p)&&text) prio[p].push({group,text,section}); };
  J.boilers.forEach(b=>{
    const entries=[];
    setOf(b).forEach(sec=>{ const e={name:cleanSec(sec.section),data:[],find:[],recs:[],touched:false};
      sec.items.forEach(it=>{ const a=J.answers[b.id+"|"+it.id]; if(!a) return;
        if(a.s||a.v||a.e) e.touched=true;
        if(it.opts&&a.e) e.data.push(baseName(qText(it))+": "+a.e);
        if((it.d==="data"||it.d==="measured")&&a.v) e.data.push(qText(it)+": "+a.v);
        if(a.s==="Defect"||a.s==="OK"){ const f=findingOf(it,a), r=recOf(it,a);
          if(f) e.find.push(f); if(r) e.recs.push(r); addPrio(a.p,bLabel(b),r||f,e.name); } });
      entries.push(e); });
    (b.extras||[]).forEach(x=>{ const e={name:cleanSec(x.name),data:[],find:[],recs:[],extra:true,touched:false};
      x.items.forEach(i=>{ if(i.s) e.touched=true; if(i.s!=="Defect"&&i.s!=="OK") return;
        let f=(i.f||"").trim(); const r=(i.r||"").trim();
        if(!f&&i.s==="Defect") f=i.title+": defect noted.";
        if(f) e.find.push(f); if(r) e.recs.push(r); addPrio(i.p,bLabel(b),r||f,e.name); });
      entries.push(e); });
    entries.filter(e=>e.touched).forEach(e=>{ if(!secs[e.name]){ secs[e.name]=[]; order.push(e.name); } secs[e.name].push(Object.assign({boiler:b},e)); });
  });
  const site=(qs.site||[]).map(sec=>{ const e={name:cleanSec(sec.section),find:[],recs:[],touched:false};
    sec.items.forEach(it=>{ const a=J.answers["site|"+it.id]; if(a&&(a.s||a.v)) e.touched=true; if(!a||(a.s!=="Defect"&&a.s!=="OK")) return;
      const f=findingOf(it,a), r=recOf(it,a); if(f) e.find.push(f); if(r) e.recs.push(r); addPrio(a.p,"Site",r||f,e.name); });
    return e; }).filter(e=>e.touched);
  const groups=J.boilers.map(bLabel).concat(["Site"]);
  return {order,secs,site,prio,groups};
}

/* =====================================================================
   WORD (DOCX) WRITER — fills the JT template skeleton
   ===================================================================== */
const XE=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
const BODY_W=9412;  // twips between the 2.2 cm side margins
function wRuns(text,o){ o=o||{};
  let rpr=""; if(o.bold) rpr+="<w:b/>"; if(o.italic) rpr+="<w:i/>"; if(o.sz) rpr+=`<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>`;
  rpr=rpr?`<w:rPr>${rpr}</w:rPr>`:"";
  return String(text==null?"":text).split("\t").map(s=>s?`<w:r>${rpr}<w:t xml:space="preserve">${XE(s)}</w:t></w:r>`:"").join(`<w:r>${rpr}<w:tab/></w:r>`); }
function wP(text,o){ o=o||{}; let ppr="";
  if(o.style) ppr+=`<w:pStyle w:val="${o.style}"/>`;
  if(o.keepNext) ppr+="<w:keepNext/>";
  if(o.keepLines) ppr+="<w:keepLines/>";
  if(o.tabs) ppr+="<w:tabs>"+o.tabs.map(p=>`<w:tab w:val="left" w:pos="${p}"/>`).join("")+"</w:tabs>";
  if(o.before!=null||o.after!=null) ppr+=`<w:spacing${o.before!=null?` w:before="${o.before}"`:""}${o.after!=null?` w:after="${o.after}"`:""}/>`;
  if(o.ind) ppr+=`<w:ind w:left="${o.ind[0]}" w:hanging="${o.ind[1]}"/>`;
  if(o.jc) ppr+=`<w:jc w:val="${o.jc}"/>`;
  return `<w:p>${ppr?`<w:pPr>${ppr}</w:pPr>`:""}${o.raw||wRuns(text,o)}</w:p>`; }
const wPageBreak=()=>`<w:p><w:r><w:br w:type="page"/></w:r></w:p>`;
const wH=(lvl,text,upper)=>wP((upper==null?lvl<=2:upper)?String(text).toUpperCase():text,{style:"Heading"+lvl,keepNext:true});
const wBullet=t=>wP("•\t"+t,{style:"ListParagraph",ind:[720,360],tabs:[720],after:40});
const wLabel=(t,o)=>wP(t,Object.assign({bold:true,keepNext:true,before:120,after:40},o||{}));
function wTable(rows,widths,o){ o=o||{};
  const grid=widths.map(w=>`<w:gridCol w:w="${w}"/>`).join("");
  const trs=rows.map(r=>`<w:tr><w:trPr><w:cantSplit/></w:trPr>${r.map((c,i)=>`<w:tc><w:tcPr><w:tcW w:w="${widths[i]}" w:type="dxa"/></w:tcPr>${wP(c,{bold:o.boldFirst&&i===0,after:0})}</w:tc>`).join("")}</w:tr>`).join("");
  return `<w:tbl><w:tblPr><w:tblStyle w:val="TableGrid"/><w:tblW w:w="${widths.reduce((a,b)=>a+b,0)}" w:type="dxa"/><w:tblLayout w:type="fixed"/><w:tblLook w:val="04A0"/></w:tblPr><w:tblGrid>${grid}</w:tblGrid>${trs}</w:tbl>`+wP("",{after:0}); }
function wImage(rid,cx,cy,id){ return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="Photo ${id}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="photo${id}.jpg"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`; }
/* photo grid: 2 x 2 per page, image fitted in BOX, rows spread evenly */
const EMU_CM=360000, BOX_W=Math.round(7.6*EMU_CM), BOX_H=Math.round(8.4*EMU_CM), ROW_H=Math.round(9.8*567);
function wPhotoGrid(cells){ const colW=BODY_W/2;
  const cell=c=>`<w:tc><w:tcPr><w:tcW w:w="${colW}" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>${c?
    wP("",{jc:"center",before:60,after:60,keepNext:true,raw:c.img})+wP(c.cap,{jc:"center",italic:true,sz:18,after:60}):wP("",{after:0})}</w:tc>`;
  let rows="";
  for(let i=0;i<cells.length;i+=2) rows+=`<w:tr><w:trPr><w:cantSplit/><w:trHeight w:val="${ROW_H}" w:hRule="atLeast"/></w:trPr>${cell(cells[i])}${cell(cells[i+1])}</w:tr>`;
  const nb=["top","left","bottom","right","insideH","insideV"].map(s=>`<w:${s} w:val="nil"/>`).join("");
  return `<w:tbl><w:tblPr><w:tblW w:w="${BODY_W}" w:type="dxa"/><w:jc w:val="center"/><w:tblBorders>${nb}</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid><w:gridCol w:w="${colW}"/><w:gridCol w:w="${colW}"/></w:tblGrid>${rows}</w:tbl>`; }

/* photo normalising: apply phone orientation, shrink to 1600 px, re-encode */
async function docPhoto(blob){
  let bmp; try{ bmp=await createImageBitmap(blob,{imageOrientation:"from-image"}); }catch(e){ bmp=await createImageBitmap(blob); }
  const s=Math.min(1,1600/Math.max(bmp.width,bmp.height)); const W=Math.max(1,Math.round(bmp.width*s)), H=Math.max(1,Math.round(bmp.height*s));
  const c=document.createElement("canvas"); c.width=W; c.height=H; const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,W,H); g.drawImage(bmp,0,0,W,H);
  if(bmp.close) bmp.close();
  const out=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("photo encode failed")),"image/jpeg",0.85)); c.width=c.height=1;
  return {bytes:new Uint8Array(await out.arrayBuffer()),w:W,h:H}; }
function photoLabel(J,p){ if(p.label) return p.label;
  const qs=J.qs||LIB; for(const part of Object.keys(qs)) if(Array.isArray(qs[part])) for(const s of qs[part]) for(const it of s.items) if(it.t===p.tag) return qText(it);
  const fp=FUEL_PHOTOS.find(f=>f[0]===p.tag); if(fp) return fp[1];
  return String(p.tag||"Photo").replace(/([a-z])([A-Z])/g,"$1 $2"); }
function photoOrder(J,photos){ // nameplate, fuel, questionnaire order, additional equipment, rest
  const rank={}; let n=0; const qs=J.qs||LIB;
  J.boilers.forEach(b=>{ rank[b.id+"|Nameplate"]=n++; FUEL_PHOTOS.forEach(f=>rank[b.id+"|"+f[0]]=n++);
    (qs.shared||[]).concat(qs[(FIRING[b.firing]||FIRING.burner).part]||[]).forEach(s=>s.items.forEach(it=>{ const k=b.id+"|"+it.t; if(!(k in rank)) rank[k]=n++; }));
    (b.extras||[]).forEach(x=>x.items.forEach(i=>rank[b.id+"|X"+i.id]=n++)); });
  (qs.site||[]).forEach(s=>s.items.forEach(it=>{ const k="site|"+it.t; if(!(k in rank)) rank[k]=n++; }));
  return photos.slice().sort((a,b)=>((rank[a.scope+"|"+a.tag]??1e6)-(rank[b.scope+"|"+b.tag]??1e6))||((a.created||0)-(b.created||0))); }

function boilerSentence(b){ const f=FIRING[b.firing]||FIRING.burner; const ft=(b.fuel&&b.fuel.type)||"";
  const fire=b.firing==="stoker"?"coal-fired chain grate stoker":b.firing==="biomass"?("biomass-fired"+(ft?` (${ft})`:"")):((ft?ft+"-fired":"oil / gas-fired")+" burner");
  let s=`Boiler ${b.no||""} is a ${[b.make,b.model].filter(Boolean).join(" ")||"boiler"}`.replace(/ is a boiler$/," is a");
  s+=` ${fire} boiler`;
  const parts=[]; if(b.capacity) parts.push(`a rated capacity of ${b.capacity} kg/h`); if(b.pressure) parts.push(`a design pressure of ${b.pressure} bar(g)`);
  if(parts.length) s+=" with "+parts.join(" and ");
  if(b.year) s+=`, manufactured in ${b.year}`; if(b.serial) s+=` (serial no. ${b.serial})`; s+=".";
  const xs=(b.extras||[]).map(x=>x.name).filter(Boolean); if(xs.length) s+=` The boiler is fitted with the following additional equipment: ${xs.join(", ")}.`;
  return s; }
function fuelRows(b){ const f=b.fuel||{}; const cat=(FIRING[b.firing]||FIRING.burner).fuel; const rows=[];
  if(f.type) rows.push(["Fuel type",f.type]);
  FUEL_FIELDS[cat].concat(FUEL_COMMON_END).forEach(([k,l])=>{ if(f[k]) rows.push([l,f[k]]); });
  return rows; }

async function buildDocx(J,prog){
  prog=prog||(()=>{}); const M=reportModel(J); const c=J.customer||{}; const prep=J.prepared||{};
  const custLine=[c.name,c.site].filter(Boolean).join(" - ");
  let B="";
  // ---- executive summary ----
  B+=wP("EXECUTIVE SUMMARY",{style:"ExecTitle"});
  B+=wP(BP.exec_intro.replace("{customer}",custLine||"the customer's site").replace("{date}",fmtDate(c.date)));
  const themes=[]; const seenT={};
  ["High","Medium"].forEach(p=>M.prio[p].forEach(e=>{ const key=e.section+"|"+e.text.toLowerCase(); if(seenT[key])return; seenT[key]=1;
    let t=themes.find(x=>x.s===e.section); if(!t){ t={s:e.section,items:[]}; themes.push(t); } t.items.push(e.text); }));
  if(themes.length){ B+=wP(BP.exec_recommend_lead); themes.forEach(t=>{ B+=wLabel(t.s+":"); t.items.forEach(x=>B+=wBullet(x)); }); }
  else B+=wP(BP.exec_none);
  B+=wPageBreak();
  // ---- 1 objective, 2 scope ----
  B+=wH(1,"Objective")+wP(BP.objective);
  B+=wH(1,"Scope of Work");
  const req=(J.scope&&J.scope.requested||[]).filter(x=>x&&x.trim()); B+=req.length?req.map(wBullet).join(""):wP(BP.scope_default);
  // ---- 3 description ----
  B+=wH(1,"Description of Boiler Plant"); J.boilers.forEach(b=>B+=wP(boilerSentence(b)));
  if(!J.boilers.length) B+=wP("No boilers were recorded.");
  // ---- 4 fuel ----
  const anyFuel=J.boilers.some(b=>fuelRows(b).length);
  if(anyFuel){ B+=wH(1,"Fuel");
    J.boilers.forEach(b=>{ const rows=fuelRows(b); B+=wH(2,`Boiler ${b.no}${b.fuel&&b.fuel.type?" - "+b.fuel.type:""}`,false);
      B+=rows.length?wTable(rows,[3800,BODY_W-3800],{boldFirst:true}):wP("Fuel details were not recorded."); }); }
  // ---- 5 boiler inspection findings ----
  B+=wH(1,"Boiler Inspection Findings");
  if(!M.order.length) B+=wP("No boiler inspection findings were recorded.");
  M.order.forEach(name=>{ B+=wH(2,name);
    M.secs[name].forEach(e=>{ B+=wH(3,"Boiler "+e.boiler.no,false);
      e.data.forEach(d=>B+=wBullet(d));
      if(e.find.length){ B+=wLabel("Findings"); e.find.forEach(f=>B+=wBullet(f)); }
      if(e.recs.length){ B+=wLabel("Recommendations"); e.recs.forEach(r=>B+=wBullet(r)); }
      if(!e.data.length&&!e.find.length&&!e.recs.length) B+=wP(BP.no_issues); }); });
  // ---- 6 site ----
  if(M.site.length){ B+=wH(1,"Site-Wide Findings and Recommendations");
    M.site.forEach(e=>{ B+=wH(2,e.name);
      if(e.find.length){ B+=wLabel("Findings"); e.find.forEach(f=>B+=wBullet(f)); }
      if(e.recs.length){ B+=wLabel("Recommendations"); e.recs.forEach(r=>B+=wBullet(r)); }
      if(!e.find.length&&!e.recs.length) B+=wP(BP.no_issues); }); }
  // ---- 7 efficiency ----
  B+=wH(1,"Efficiency")+wP(BP.efficiency_text);
  const firings=[...new Set(J.boilers.map(b=>b.firing))].filter(f=>BP.efficiency_targets[f]);
  if(firings.length) B+=wTable([["Firing","Target flue gas O2"]].concat(firings.map(f=>BP.efficiency_targets[f])),[5600,BODY_W-5600],{boldFirst:false});
  // ---- 8 recommendations ----
  B+=wH(1,"Recommendations");
  PRIO.forEach(p=>{ B+=wH(2,p+" Priority",false); const items=M.prio[p];
    if(!items.length){ B+=wP("None."); return; }
    M.groups.forEach(g=>{ const its=items.filter(e=>e.group===g); if(!its.length) return; B+=wLabel(g); its.forEach(e=>B+=wBullet(e.text)); }); });
  // ---- 9 work done ----
  B+=wH(1,"Work Done on Site");
  const done=(J.scope&&J.scope.done||[]).filter(x=>x&&x.trim()); B+=done.length?done.map(wBullet).join(""):wP(BP.work_done_none);
  // ---- 10 appendix ----
  B+=wPageBreak()+wH(1,"Appendix A - Boiler Details");
  J.boilers.forEach(b=>{ B+=wLabel("Boiler "+b.no);
    const rows=[["Make",b.make],["Model",b.model],["Serial number",b.serial],["Capacity (kg/h)",b.capacity],["Design pressure (bar g)",b.pressure],["Year of manufacture",b.year],["Firing",(FIRING[b.firing]||FIRING.burner).label],["Fuel",b.fuel&&b.fuel.type]];
    const xs=(b.extras||[]).map(x=>x.name).filter(Boolean); if(xs.length) rows.push(["Additional equipment",xs.join(", ")]);
    B+=wTable(rows.map(r=>[r[0],r[1]||"-"]),[3800,BODY_W-3800],{boldFirst:true}); });
  // ---- 11 photographs ----
  const media=[]; let fig=0, rid=0, did=900000000;
  const allPh=(await photosOf(J.id)).filter(p=>p.include);
  if(allPh.length){
    const ordered=photoOrder(J,allPh); const total=ordered.length;
    const scopes=J.boilers.map(b=>b.id).concat(["site"]); const lab=s=>s==="site"?"Site":"Boiler "+(boilerOf2(J,s)||{}).no;
    B+=wPageBreak()+wH(1,"Photographs"); let first=true, done_n=0;
    for(const s of scopes){ const list=ordered.filter(p=>p.scope===s); if(!list.length) continue;
      if(!first) B+=wPageBreak(); first=false;
      B+=wH(2,lab(s),false);
      for(let i=0;i<list.length;i+=4){
        if(i>0) B+=wPageBreak()+wLabel(lab(s)+" (continued)",{keepNext:true});
        const cells=[];
        for(const p of list.slice(i,i+4)){ done_n++; prog(`Preparing photo ${done_n} of ${total}...`);
          let ph; try{ ph=await docPhoto(p.blob); }catch(e){ cells.push({img:wRuns("[photo could not be read]"),cap:p.filename||""}); continue; }
          fig++; rid++; did++; const r="rIdJTPh"+rid; media.push({rid:r,name:`media/jtphoto${rid}.jpg`,bytes:ph.bytes});
          let cx=BOX_W, cy=Math.round(BOX_W*ph.h/ph.w); if(cy>BOX_H){ cy=BOX_H; cx=Math.round(BOX_H*ph.w/ph.h); }
          cells.push({img:wImage(r,cx,cy,did),cap:`Figure ${fig}: ${lab(s)} - ${p.caption||photoLabel(J,p)}`});
          await new Promise(r=>setTimeout(r,0)); }

  prog("Assembling Word document...");
  // ---- fill the template skeleton ----
  const files={}; for(const [path,[kind,data]] of Object.entries(TPL.files)) files[path]=kind==="b"?b64bytes(data):data;
  const distRec=(c.dist||[]).filter(d=>d.name||d.email);
  const distLine=(nm,how)=>TPL.dist.split("@@NAME@@").join(XE(nm)).split("@@HOW@@").join(how);
  const distXml=distRec.map(d=>distLine(d.name||d.email,"(email)")).join("")+distLine("Master File","");
  let doc=files["word/document.xml"];
  doc=doc.split("@@CUSTOMER@@").join(XE(custLine)).split("@@REPORTNO@@").join(XE(c.reportNo||""))
         .split("@@PREPNAME@@").join(XE(prep.name||BP.prepared_by_name)).split("@@PREPTITLE@@").join(XE(prep.title||BP.prepared_by_title))
         .split("@@DIST@@").join(distXml);
  doc=doc.replace("@@BODY@@",()=>B);
  files["word/document.xml"]=doc;
  for(const path of Object.keys(files)) if(/^word\/header\d+\.xml$/.test(path))
    files[path]=files[path].split("@@HRN@@").join(XE(c.reportNo||"")).split("@@HCUST@@").join(XE(custLine)).split("@@HDATE@@").join(XE(fmtDate(c.date)));
  files["word/_rels/document.xml.rels"]=files["word/_rels/document.xml.rels"].replace("</Relationships>",
    media.map(m=>`<Relationship Id="${m.rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="${m.name.replace(/^media\//,"media/")}"/>`).join("")+"</Relationships>");
  media.forEach(m=>files["word/"+m.name]=m.bytes);
  const enc=new TextEncoder(); const names=Object.keys(files).sort((a,b)=>(a==="[Content_Types].xml"?-1:b==="[Content_Types].xml"?1:0));
  return zipBlob(names.map(n=>({name:n,data:typeof files[n]==="string"?enc.encode(files[n]):files[n]})),"application/vnd.openxmlformats-officedocument.wordprocessingml.document");
}
